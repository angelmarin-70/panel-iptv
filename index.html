<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IPTV Admin - Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #0b0f19 !important; color: #ffffff !important; font-family: system-ui, -apple-system, sans-serif; padding: 20px; }
        .section-box { background-color: #151c2c !important; border: 2px solid #2d3748 !important; border-radius: 12px; padding: 20px; margin-bottom: 25px; }
        .section-title { font-size: 1.1rem; font-weight: 800; text-transform: uppercase; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        .btn-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
        .btn-panel-box { background-color: #1e293b !important; border: 1px solid #475569 !important; border-radius: 8px; padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
        .btn-panel-box:hover { background-color: #334155 !important; border-color: #38bdf8 !important; }
        .btn-app-box { background-color: #1d4ed8 !important; border: 1px solid #3b82f6 !important; }
        .btn-app-box:hover { background-color: #2563eb !important; }
        .panel-link { color: #ffffff !important; text-decoration: none !important; font-weight: 700; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; width: 100%; }
        .btn-edit-icon { color: #fbbf24 !important; font-size: 1rem; cursor: pointer; }
        label { color: #38bdf8 !important; font-weight: 800 !important; font-size: 0.9rem; margin-bottom: 6px; display: block; text-transform: uppercase; }
        .form-control, .form-select { background-color: #0f172a !important; border: 2px solid #475569 !important; color: #ffffff !important; font-size: 0.95rem !important; font-weight: 600 !important; padding: 10px !important; }
        .form-control:focus, .form-select:focus { background-color: #1e293b !important; border-color: #38bdf8 !important; color: #ffffff !important; box-shadow: 0 0 10px rgba(56, 189, 248, 0.5) !important; }
        ::placeholder { color: #94a3b8 !important; opacity: 1 !important; }
        option { background-color: #0f172a !important; color: #ffffff !important; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); cursor: pointer; }
        .table-custom { color: #ffffff !important; margin: 0; }
        .table-custom th { background-color: #1e293b !important; color: #38bdf8 !important; border-bottom: 2px solid #475569 !important; padding: 12px; font-weight: 800; }
        .table-custom td { background-color: #0f172a !important; border-bottom: 1px solid #1e293b !important; padding: 12px; vertical-align: middle; color: #ffffff !important; }
        .btn-whatsapp { background-color: #25d366 !important; color: #ffffff !important; font-weight: bold; border: none !important; }
        .btn-whatsapp:hover { background-color: #1da851 !important; }
        .notepad-modal { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(11, 15, 25, 0.98); z-index: 99999; padding: 25px; box-sizing: border-box; flex-direction: column; }
        .notepad-modal.active { display: flex; }
        .notepad-textarea { width: 100%; height: 100%; background-color: #050811 !important; color: #00ffcc !important; font-family: monospace; font-size: 1.1rem !important; padding: 20px !important; border: 2px solid #38bdf8 !important; border-radius: 8px; resize: none; }
        .sync-badge { font-size: 0.85rem; padding: 5px 12px; border-radius: 20px; }
    </style>
</head>
<body>

<div class="container-fluid max-w-7xl mx-auto">
    <!-- CABECERA -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3 class="fw-bold m-0 text-white"><i class="bi bi-cpu-fill text-info me-2"></i>Panel IPTV Admin</h3>
            <span id="syncStatus" class="badge bg-secondary sync-badge mt-1"><i class="bi bi-cloud-slash me-1"></i> Conectando a Firebase...</span>
        </div>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-primary btn-sm" onclick="requestNotificationPermission()"><i class="bi bi-bell-fill"></i> Notificaciones</button>
            <button class="btn btn-outline-warning btn-sm" onclick="resetLinks()"><i class="bi bi-arrow-counterclockwise"></i> Reset URLs</button>
            <button class="btn btn-outline-info btn-sm" onclick="document.getElementById('importFile').click()"><i class="bi bi-upload"></i> Cargar Copia</button>
            <input type="file" id="importFile" style="display:none;" onchange="importBackup(event)">
            <button class="btn btn-success btn-sm" onclick="exportBackup()"><i class="bi bi-download"></i> Guardar Copia</button>
        </div>
    </div>

    <!-- PANELES IPTV -->
    <div class="section-box">
        <div class="section-title text-info"><i class="bi bi-grid-3x3-gap-fill"></i> Paneles IPTV</div>
        <div class="btn-grid" id="iptvGrid"></div>
    </div>

    <!-- PANELES APLICACIONES -->
    <div class="section-box">
        <div class="section-title text-primary"><i class="bi bi-app-indicator"></i> Paneles de Aplicaciones</div>
        <div class="btn-grid" id="appGrid"></div>
    </div>

    <!-- BLOC DE NOTAS / DNS -->
    <div class="section-box">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="section-title text-warning m-0"><i class="bi bi-journal-text me-1"></i> Bloc de Notas & DNS</div>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="noteCategorySelect" style="width: 240px;" onchange="changeNoteCategory()">
                    <option value="dns_iptv">🌐 DNS</option>
                    <option value="apks">📲 APKs</option>
                    <option value="app_codes">🔑 Códigos & Activaciones App</option>
                    <option value="general_notes">📝 Notas Generales</option>
                </select>
                <button class="btn btn-warning btn-sm fw-bold px-3" onclick="openNotepadModal()"><i class="bi bi-arrows-fullscreen me-1"></i> Abrir a Pantalla Completa</button>
            </div>
        </div>
    </div>

    <!-- VENTANA FLOTANTE BLOC DE NOTAS -->
    <div class="notepad-modal" id="notepadModal">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-warning" id="modalTitle"><i class="bi bi-file-earmark-code me-2"></i> Bloc de Notas - DNS</h4>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="clearCurrentNote()"><i class="bi bi-eraser"></i> Limpiar</button>
                <button class="btn btn-success btn-sm fw-bold px-4" onclick="saveCurrentNote()"><i class="bi bi-save me-1"></i> Guardar Cambios</button>
                <button class="btn btn-danger btn-sm px-3" onclick="closeNotepadModal()"><i class="bi bi-x-lg me-1"></i> Cerrar</button>
            </div>
        </div>
        <textarea class="notepad-textarea" id="noteTextArea" placeholder="Escribe o pega aquí tus direcciones DNS, APKs, notas o claves..."></textarea>
    </div>

    <!-- BOT TELEGRAM -->
    <div class="section-box">
        <div class="section-title text-warning"><i class="bi bi-telegram"></i> Alertas por Telegram</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Telegram Bot Token</label>
                <input type="text" class="form-control" id="tgToken" placeholder="123456789:ABCdef..." onchange="saveTgConfig()">
            </div>
            <div class="col-md-6">
                <label>Telegram Chat ID</label>
                <input type="text" class="form-control" id="tgChatId" placeholder="987654321" onchange="saveTgConfig()">
            </div>
        </div>
    </div>

    <!-- REGISTRO DE CLIENTE -->
    <div class="section-box">
        <div class="section-title text-success" id="formTitle"><i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente</div>
        <form id="clientForm" onsubmit="event.preventDefault(); saveClientForm();">
            <input type="hidden" id="editClientId" value="">
            <div class="row g-3">
                <div class="col-md-3">
                    <label>Nombre del Cliente *</label>
                    <input type="text" class="form-control" id="cName" required placeholder="Nombre completo">
                </div>
                <div class="col-md-3">
                    <label>Teléfono (WhatsApp) *</label>
                    <input type="text" class="form-control" id="cPhone" required placeholder="+34612345678">
                </div>
                <div class="col-md-3">
                    <label>Usuario Panel / App</label>
                    <input type="text" class="form-control" id="cUser" placeholder="Ej: usuario123">
                </div>
                <div class="col-md-3">
                    <label>Contraseña</label>
                    <input type="text" class="form-control" id="cPass" placeholder="Ej: clave123">
                </div>
                <div class="col-md-3">
                    <label>Servidor / Panel IPTV</label>
                    <select class="form-select" id="cServer">
                        <option value="NetTV">NetTV</option>
                        <option value="Max Player">Max Player</option>
                        <option value="Emby">Emby</option>
                        <option value="Zafiro">Zafiro</option>
                        <option value="Dylan">Dylan</option>
                        <option value="Joker">Joker</option>
                        <option value="TS4K">TS4K</option>
                        <option value="Nexon">Nexon</option>
                        <option value="Regilón">Regilón</option>
                        <option value="DonIPTV">DonIPTV</option>
                        <option value="P2P">P2P</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Aplicación Instalada</label>
                    <select class="form-select" id="cApp">
                        <option value="Max Player">Max Player</option>
                        <option value="IBO Player">IBO Player</option>
                        <option value="iBox Player">iBox Player</option>
                        <option value="Smartone">Smartone</option>
                        <option value="CR7 Panel">CR7 Panel</option>
                        <option value="IBO Sol">IBO Sol</option>
                        <option value="IBO Lopes">IBO Lopes</option>
                        <option value="DonIBO">DonIBO</option>
                        <option value="TiviMate VPN">TiviMate VPN</option>
                        <option value="VU Player">VU Player</option>
                        <option value="IBO Killer">IBO Killer</option>
                        <option value="XCIPTV Phoenix">XCIPTV Phoenix</option>
                        <option value="TiviMate Phoenix">TiviMate Phoenix</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Dirección MAC</label>
                    <input type="text" class="form-control" id="cMac" placeholder="00:1A:2B:3C:4D:5E">
                </div>
                <div class="col-md-3">
                    <label>Fecha Vencimiento *</label>
                    <input type="date" class="form-control" id="cExpiry" required>
                </div>
                <div class="col-md-12">
                    <label>Notas Adicionales</label>
                    <input type="text" class="form-control" id="cNotes" placeholder="Dispositivo, observaciones, etc.">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3" onclick="resetForm()">Limpiar / Cancelar</button>
                <button type="submit" class="btn btn-success btn-sm px-4 fw-bold" id="btnSaveClient"><i class="bi bi-save me-1"></i> Guardar Cliente</button>
            </div>
        </form>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div class="section-box">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div class="section-title text-warning m-0"><i class="bi bi-people-fill"></i> Clientes (<span id="clientCount">0</span>)</div>
            <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-outline-info active" id="filterAll" onclick="setFilter('all')">Todos</button>
                <button type="button" class="btn btn-outline-warning" id="filterToday" onclick="setFilter('today')">Vencen Hoy</button>
                <button type="button" class="btn btn-outline-primary" id="filterWeek" onclick="setFilter('week')">Esta Semana</button>
                <button type="button" class="btn btn-outline-danger" id="filterExpired" onclick="setFilter('expired')">Caducados</button>
            </div>
            <div style="width: 250px;">
                <input type="text" class="form-control form-control-sm" id="searchBox" placeholder="Buscar cliente, tel, MAC..." onkeyup="renderTable()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Cliente / Teléfono</th>
                        <th>Credenciales</th>
                        <th>Servidor / App</th>
                        <th>MAC</th>
                        <th>Vencimiento</th>
                        <th class="text-center">Aviso WhatsApp</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const FIREBASE_URL = "https://mi-panel-iptv-1954-default-rtdb.firebaseio.com/";

    // PANELES IPTV FIJOS
    const defaultIptvLinks = [
        { id: 'nettv', name: 'NetTV', icon: 'bi-tv', url: 'https://nettv.mypannel.xyz/reseller/login.php?referrer=edit_subreseller.php?id=11100' },
        { id: 'emby', name: 'Emby', icon: 'bi-hdd-network', url: 'http://31.220.73.197:8096' },
        { id: 'zafiro', name: 'Zafiro', icon: 'bi-gem', url: 'http://panel.zafiro.pro' },
        { id: 'dylan', name: 'Dylan', icon: 'bi-play-circle', url: 'http://dylan.ott-panel.com' },
        { id: 'joker', name: 'Joker', icon: 'bi-lightning', url: 'http://joker-tv.top' },
        { id: 'ts4k', name: 'TS4K', icon: 'bi-box', url: 'http://ts4k.vip' },
        { id: 'nexon', name: 'Nexon', icon: 'bi-cpu', url: 'http://nexon.pro' },
        { id: 'regilon', name: 'Regilón', icon: 'bi-globe', url: 'http://regioniptv.com' },
        { id: 'doniptv', name: 'DonIPTV', icon: 'bi-broadcast', url: 'http://doniptv.org' },
        { id: 'p2p', name: 'P2P', icon: 'bi-diagram-3', url: 'http://p2p-panel.net' }
    ];

    // PANELES APLICACIONES FIJOS
    const defaultAppLinks = [
        { id: 'maxplayer', name: 'Max Player', icon: 'bi-display', url: 'https://my.maxplayer.tv/auth/login' },
        { id: 'ibox', name: 'iBox Player', icon: 'bi-box', url: 'https://iboxxiptv.com/device/login' },
        { id: 'smartone', name: 'Smartone', icon: 'bi-tv', url: 'https://smartone-iptv.com/es/aplicacion-iptv-para-samsung' },
        { id: 'cr7', name: 'CR7 Panel', icon: 'bi-shield', url: 'https://cr7panel.com/' },
        { id: 'ibo', name: 'IBO Player', icon: 'bi-play-circle', url: 'https://iboplayer.com/' },
        { id: 'ibosol', name: 'IBO Sol', icon: 'bi-sun', url: 'https://ibosol.com/login' },
        { id: 'ibolopes', name: 'IBO Lopes', icon: 'bi-controller', url: 'https://maxtvapps.pw/Apks/Ibo/Lopes/index.php' },
        { id: 'donibo', name: 'DonIBO', icon: 'bi-check-circle', url: 'https://nertix.org/ibopanel4/users.php' },
        { id: 'thimata', name: 'TiviMate VPN', icon: 'bi-key', url: 'https://globalvip.website/rbatv/nuepp/tiviproat' },
        { id: 'vuplayer', name: 'VU Player', icon: 'bi-collection-play', url: 'https://rgvipplus.site/vu2/marine' },
        { id: 'ibokiller', name: 'IBO Killer', icon: 'bi-x-circle', url: 'https://maxtvapps.pw/Apks/Ibo/Killer1/' },
        { id: 'xciptv', name: 'XCIPTV Phoenix', icon: 'bi-fire', url: 'https://maxtvapps.pw/Apks/Xciptv/Phoenix/index.php' },
        { id: 'tivimate', name: 'TiviMate Phoenix', icon: 'bi-lightning-charge', url: 'https://maxtvapps.pw/Apks/Tivimate/Phoenix/' }
    ];

    let customLinks = JSON.parse(localStorage.getItem('iptv_custom_urls')) || {};
    let activeFilter = 'all';
    let dbRef = null;
    let clients = [];

    function initFirebase() {
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp({ databaseURL: FIREBASE_URL });
            }
            dbRef = firebase.database().ref('iptv_admin_data');

            dbRef.on('value', (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    if (data.clients) {
                        clients = data.clients;
                        saveClientsLocal();
                        renderTable();
                    }
                    if (data.notes) {
                        localStorage.setItem('iptv_multi_notes', JSON.stringify(data.notes));
                        loadCurrentNote();
                    }
                }
            });

            document.getElementById('syncStatus').className = "badge bg-success sync-badge mt-1";
            document.getElementById('syncStatus').innerHTML = '<i class="bi bi-cloud-check-fill me-1"></i> Conectado a Firebase (Nube Activa)';
        } catch(e) {
            console.error(e);
            document.getElementById('syncStatus').className = "badge bg-danger sync-badge mt-1";
            document.getElementById('syncStatus').innerText = "Error de conexión";
        }
    }

    function syncToCloud() {
        if (dbRef) {
            const savedNotes = JSON.parse(localStorage.getItem('iptv_multi_notes')) || {};
            dbRef.set({ clients: clients, notes: savedNotes });
        }
    }

    function renderButtons() {
        const iptvGrid = document.getElementById('iptvGrid');
        const appGrid = document.getElementById('appGrid');
        iptvGrid.innerHTML = ''; appGrid.innerHTML = '';

        defaultIptvLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            iptvGrid.appendChild(createButtonBox(item, finalUrl, false));
        });

        defaultAppLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            appGrid.appendChild(createButtonBox(item, finalUrl, true));
        });
    }

    function createButtonBox(item, url, isApp) {
        const div = document.createElement('div');
        div.className = `btn-panel-box ${isApp ? 'btn-app-box' : ''}`;
        div.innerHTML = `
            <a href="${url}" class="panel-link" target="_blank" rel="noopener noreferrer">
                <i class="bi ${item.icon}"></i> ${item.name}
            </a>
            <i class="bi bi-pencil-fill btn-edit-icon" title="Editar URL" onclick="editUrl('${item.id}', '${item.name}', '${url}')"></i>
        `;
        return div;
    }

    function editUrl(id, name, currentUrl) {
        const newUrl = prompt(`Cambiar enlace para ${name}:`, currentUrl);
        if (newUrl !== null) {
            customLinks[id] = newUrl.trim();
            localStorage.setItem('iptv_custom_urls', JSON.stringify(customLinks));
            renderButtons();
        }
    }

    function resetLinks() {
        if(confirm('¿Restablecer los botones a las URLs por defecto fijadas en el código?')) {
            localStorage.removeItem('iptv_custom_urls');
            customLinks = {};
            renderButtons();
        }
    }

    function requestNotificationPermission() {
        if (!("Notification" in window)) return alert("Tu navegador no soporta notificaciones.");
        Notification.requestPermission().then(permission => {
            if (permission === "granted") new Notification("Panel IPTV Admin", { body: "Notificaciones activadas correctamente." });
        });
    }

    // BLOC DE NOTAS
    let currentCategoryKey = 'dns_iptv';

    function openNotepadModal() {
        saveCurrentNote(false);
        currentCategoryKey = document.getElementById('noteCategorySelect').value;
        const selectText = document.getElementById('noteCategorySelect').options[document.getElementById('noteCategorySelect').selectedIndex].text;
        document.getElementById('modalTitle').innerHTML = `<i class="bi bi-file-earmark-code me-2"></i> ${selectText}`;
        loadCurrentNote();
        document.getElementById('notepadModal').classList.add('active');
    }

    function closeNotepadModal() {
        saveCurrentNote(false);
        document.getElementById('notepadModal').classList.remove('active');
    }

    function changeNoteCategory() {
        saveCurrentNote(false);
        currentCategoryKey = document.getElementById('noteCategorySelect').value;
        const selectText = document.getElementById('noteCategorySelect').options[document.getElementById('noteCategorySelect').selectedIndex].text;
        document.getElementById('modalTitle').innerHTML = `<i class="bi bi-file-earmark-code me-2"></i> ${selectText}`;
        loadCurrentNote();
    }

    function loadCurrentNote() {
        const savedNotes = JSON.parse(localStorage.getItem('iptv_multi_notes')) || {};
        document.getElementById('noteTextArea').value = savedNotes[currentCategoryKey] || '';
    }

    function saveCurrentNote(showAlert = true) {
        const savedNotes = JSON.parse(localStorage.getItem('iptv_multi_notes')) || {};
        savedNotes[currentCategoryKey] = document.getElementById('noteTextArea').value;
        localStorage.setItem('iptv_multi_notes', JSON.stringify(savedNotes));
        syncToCloud();
        if (showAlert) alert('Nota guardada y sincronizada.');
    }

    function clearCurrentNote() {
        if(confirm('¿Borrar texto de esta categoría?')) {
            document.getElementById('noteTextArea').value = '';
            saveCurrentNote(false);
        }
    }

    // CLIENTES
    function saveClientsLocal() { localStorage.setItem('iptv_clients_full', JSON.stringify(clients)); }

    function saveClients() {
        saveClientsLocal();
        syncToCloud();
    }

    function saveClientForm() {
        const editId = document.getElementById('editClientId').value;
        const clientData = {
            id: editId ? editId : Date.now().toString(),
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            user: document.getElementById('cUser').value,
            pass: document.getElementById('cPass').value,
            server: document.getElementById('cServer').value,
            app: document.getElementById('cApp').value,
            mac: document.getElementById('cMac').value,
            expiry: document.getElementById('cExpiry').value,
            notes: document.getElementById('cNotes').value
        };

        if (editId) {
            const index = clients.findIndex(c => c.id === editId);
            if (index !== -1) clients[index] = clientData;
        } else {
            clients.push(clientData);
            sendTelegramAlert(`🟢 *Nuevo Cliente*\n👤 *Cliente:* ${clientData.name}\n📱 *Tel:* ${clientData.phone}\n📅 *Vence:* ${clientData.expiry}`);
        }

        saveClients();
        resetForm();
        renderTable();
    }

    function editClient(id) {
        const client = clients.find(c => c.id === id);
        if (!client) return;
        document.getElementById('editClientId').value = client.id;
        document.getElementById('cName').value = client.name || '';
        document.getElementById('cPhone').value = client.phone || '';
        document.getElementById('cUser').value = client.user || '';
        document.getElementById('cPass').value = client.pass || '';
        document.getElementById('cServer').value = client.server || 'NetTV';
        document.getElementById('cApp').value = client.app || 'Max Player';
        document.getElementById('cMac').value = client.mac || '';
        document.getElementById('cExpiry').value = client.expiry || '';
        document.getElementById('cNotes').value = client.notes || '';
        document.getElementById('formTitle').innerHTML = `<i class="bi bi-pencil-square text-warning"></i> Editando: ${client.name}`;
        window.scrollTo({ top: document.getElementById('clientForm').offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editClientId').value = '';
        document.getElementById('clientForm').reset();
        document.getElementById('formTitle').innerHTML = `<i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente`;
    }

    function setFilter(filterType) {
        activeFilter = filterType;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        if (filterType === 'all') document.getElementById('filterAll').classList.add('active');
        if (filterType === 'today') document.getElementById('filterToday').classList.add('active');
        if (filterType === 'week') document.getElementById('filterWeek').classList.add('active');
        if (filterType === 'expired') document.getElementById('filterExpired').classList.add('active');
        renderTable();
    }

    function sendWhatsApp(phone, name, expiry, app) {
        if (!phone) return alert("No hay teléfono registrado.");
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const today = new Date().toISOString().slice(0, 10);
        let msg = `Buenas ${name}, te caduca la aplicación (${app || 'IPTV'}) `;
        if (expiry < today) msg += `caducó el ${expiry}. ¿Te interesa renovar? Gracias.`;
        else if (expiry === today) msg += `caduca HOY. ¿Te interesa renovar? Gracias.`;
        else msg += `en los días que le quedan (${expiry}). ¿Te interesa renovar? Gracias.`;
        window.open(`https://wa.me/${cleanPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const query = document.getElementById('searchBox').value.toLowerCase();
        tbody.innerHTML = '';

        const todayStr = new Date().toISOString().slice(0, 10);
        const nextWeek = new Date(); nextWeek.setDate(nextWeek.getDate() + 7);
        const nextWeekStr = nextWeek.toISOString().slice(0, 10);

        let filtered = clients.filter(c => 
            (c.name && c.name.toLowerCase().includes(query)) || 
            (c.phone && c.phone.includes(query)) ||
            (c.user && c.user.toLowerCase().includes(query)) ||
            (c.mac && c.mac.toLowerCase().includes(query))
        );

        if (activeFilter === 'today') filtered = filtered.filter(c => c.expiry === todayStr);
        else if (activeFilter === 'week') filtered = filtered.filter(c => c.expiry >= todayStr && c.expiry <= nextWeekStr);
        else if (activeFilter === 'expired') filtered = filtered.filter(c => c.expiry < todayStr);

        document.getElementById('clientCount').innerText = filtered.length;

        filtered.forEach(c => {
            const tr = document.createElement('tr');
            let badgeClass = c.expiry < todayStr ? 'bg-danger' : (c.expiry === todayStr ? 'bg-warning text-dark' : 'bg-info text-dark');
            tr.innerHTML = `
                <td><strong>${c.name || '-'}</strong><br><small class="text-info">${c.phone || '-'}</small></td>
                <td><small>U: ${c.user || '-'}<br>C: ${c.pass || '-'}</small></td>
                <td><span class="badge bg-primary">${c.server || '-'}</span><br><small class="text-light">${c.app || '-'}</small></td>
                <td><small class="text-warning">${c.mac || '-'}</small></td>
                <td><span class="badge ${badgeClass}">${c.expiry || '-'}</span></td>
                <td class="text-center"><button class="btn btn-whatsapp btn-sm px-3" onclick="sendWhatsApp('${c.phone}', '${c.name}', '${c.expiry}', '${c.app}')"><i class="bi bi-whatsapp me-1"></i> Contactar</button></td>
                <td class="text-center">
                    <button class="btn btn-outline-warning btn-sm me-1" onclick="editClient('${c.id}')"><i class="bi bi-pencil-fill"></i></button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteClient('${c.id}')"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteClient(id) {
        if(confirm('¿Eliminar cliente?')) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
            renderTable();
        }
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(clients, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_iptv_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                clients = JSON.parse(e.target.result);
                saveClients();
                renderTable();
                alert('¡Copia cargada!');
            } catch(err) { alert('Archivo JSON inválido.'); }
        };
        reader.readAsText(file);
    }

    function saveTgConfig() {
        const tgData = { token: document.getElementById('tgToken').value, chatId: document.getElementById('tgChatId').value };
        localStorage.setItem('iptv_tg_config', JSON.stringify(tgData));
    }

    function loadTgConfig() {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (tgData.token) document.getElementById('tgToken').value = tgData.token;
        if (tgData.chatId) document.getElementById('tgChatId').value = tgData.chatId;
    }

    function sendTelegramAlert(msg) {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (!tgData.token || !tgData.chatId) return;
        fetch(`https://api.telegram.org/bot${tgData.token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgData.chatId, text: msg, parse_mode: 'Markdown' })
        });
    }

    // Inicialización
    renderButtons();
    loadTgConfig();
    initFirebase();
</script>
</body>
</html>
