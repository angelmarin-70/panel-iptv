<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control IPTV - Completo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root {
            --bg-color: #0b1120;
            --card-bg: #111827;
            --card-border: #1f2937;
            --btn-iptv: #1e293b;
            --btn-app: #1d4ed8;
            --text-main: #f8fafc;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .section-box {
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #9ca3af;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 10px;
        }
        @media (max-width: 992px) { .btn-grid { grid-template-columns: repeat(3, 1fr); } }
        @media (max-width: 576px) { .btn-grid { grid-template-columns: repeat(2, 1fr); } }

        .btn-panel {
            background-color: var(--btn-iptv);
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-panel:hover { background-color: #374151; color: #fff; }

        .btn-app {
            background-color: var(--btn-app);
            border: 1px solid #2563eb;
            color: #ffffff;
        }
        .btn-app:hover { background-color: #2563eb; }

        .btn-edit-icon {
            opacity: 0.5;
            font-size: 0.75rem;
        }
        .btn-edit-icon:hover { opacity: 1; color: #f59e0b; }

        .form-control, .form-select {
            background-color: #1f2937;
            border: 1px solid #374151;
            color: #ffffff;
            font-size: 0.85rem;
        }
        .form-control:focus, .form-select:focus {
            background-color: #1f2937;
            color: #ffffff;
            border-color: #3b82f6;
            box-shadow: none;
        }
        .table-custom { color: #ffffff; font-size: 0.85rem; margin: 0; }
        .table-custom th { background-color: #1f2937; color: #9ca3af; border-bottom: 1px solid #374151; }
        .table-custom td { border-bottom: 1px solid #1f2937; vertical-align: middle; }
    </style>
</head>
<body>

<div class="container-fluid max-w-7xl mx-auto">
    <!-- Header principal -->
    <div class="header-bar">
        <div>
            <h5 class="fw-bold m-0"><i class="bi bi-box-seam me-2"></i>Panel de Control IPTV</h5>
        </div>
        <div>
            <button class="btn btn-warning btn-sm me-2" onclick="resetLinks()"><i class="bi bi-arrow-counterclockwise me-1"></i> Restaurar URLs</button>
            <button class="btn btn-success btn-sm" onclick="exportBackup()"><i class="bi bi-download me-1"></i> Exportar Copia</button>
        </div>
    </div>

    <!-- PANELES IPTV -->
    <div class="section-box">
        <div class="section-title"><i class="bi bi-grid-fill"></i> PANELES IPTV</div>
        <div class="btn-grid" id="iptvGrid"></div>
    </div>

    <!-- PANELES APLICACIONES -->
    <div class="section-box">
        <div class="section-title"><i class="bi bi-app-indicator"></i> PANELES APLICACIONES</div>
        <div class="btn-grid" id="appGrid"></div>
    </div>

    <!-- CONFIGURACIÓN BOT TELEGRAM -->
    <div class="section-box">
        <div class="section-title text-info"><i class="bi bi-telegram"></i> Configuración Bot de Telegram</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label class="form-label small text-muted">Telegram Bot Token</label>
                <input type="text" class="form-control" id="tgToken" placeholder="123456789:ABCdef..." onchange="saveTgConfig()">
            </div>
            <div class="col-md-6">
                <label class="form-label small text-muted">Telegram Chat ID</label>
                <input type="text" class="form-control" id="tgChatId" placeholder="987654321" onchange="saveTgConfig()">
            </div>
        </div>
    </div>

    <!-- REGISTRAR NUEVO CLIENTE -->
    <div class="section-box">
        <div class="section-title text-success"><i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente</div>
        <form id="clientForm" onsubmit="event.preventDefault(); addClient();">
            <div class="row g-3">
                <div class="col-md-3">
                    <label class="form-label small text-muted">Nombre del Cliente *</label>
                    <input type="text" class="form-control" id="cName" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Usuario Panel / App</label>
                    <input type="text" class="form-control" id="cUser" placeholder="Usuario">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Teléfono Cliente (WhatsApp)</label>
                    <input type="text" class="form-control" id="cPhone" placeholder="+34123456789">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Aplicación Instalada</label>
                    <select class="form-select" id="cApp">
                        <option value="Max Player">Max Player</option>
                        <option value="IBO Player">IBO Player</option>
                        <option value="NetTV App">NetTV App</option>
                        <option value="iBox Player">iBox Player</option>
                        <option value="Smartone">Smartone</option>
                        <option value="VU Player">VU Player</option>
                        <option value="XCIPTV">XCIPTV</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Contraseña App / Panel</label>
                    <input type="text" class="form-control" id="cPass">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Panel IPTV / Servidor</label>
                    <select class="form-select" id="cServer">
                        <option value="NetTV">NetTV</option>
                        <option value="Max Player">Max Player</option>
                        <option value="Emby">Emby</option>
                        <option value="Zafiro">Zafiro</option>
                        <option value="Dylan">Dylan</option>
                        <option value="Joker">Joker</option>
                        <option value="TS4K">TS4K</option>
                        <option value="Nexon">Nexon</option>
                        <option value="DonIPTV">DonIPTV</option>
                        <option value="P2P">P2P</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Dirección MAC</label>
                    <input type="text" class="form-control" id="cMac" placeholder="00:1A:2B:3C:4D:5E">
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted">Fecha de Vencimiento *</label>
                    <input type="date" class="form-control" id="cExpiry" required>
                </div>
                <div class="col-md-12">
                    <label class="form-label small text-muted">Notas / Observaciones</label>
                    <input type="text" class="form-control" id="cNotes" placeholder="Ej: Dispositivo Samsung TV">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-3">
                <button type="button" class="btn btn-secondary btn-sm px-3" onclick="document.getElementById('clientForm').reset()">Limpiar</button>
                <button type="submit" class="btn btn-success btn-sm px-3"><i class="bi bi-floppy me-1"></i> Guardar Cliente</button>
            </div>
        </form>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div class="section-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="section-title m-0"><i class="bi bi-people-fill"></i> Lista de Clientes (<span id="clientCount">0</span>)</div>
            <div style="width: 280px;">
                <input type="text" class="form-control form-control-sm" id="searchBox" placeholder="Buscar cliente, teléfono, MAC..." onkeyup="renderTable()">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Cliente / Teléfono</th>
                        <th>Usuario / Clave</th>
                        <th>Servidor / App</th>
                        <th>MAC</th>
                        <th>Vencimiento</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const defaultIptvLinks = [
        { id: 'nettv', name: 'NetTV', icon: 'bi-tv', url: 'https://nettv.mypannel.xyz/reseller/login.php?referrer=edit_subreseller.php?id=11100' },
        { id: 'emby', name: 'Emby', icon: 'bi-hdd-network', url: '#' },
        { id: 'zafiro', name: 'Zafiro', icon: 'bi-gem', url: '#' },
        { id: 'dylan', name: 'Dylan', icon: 'bi-play-circle', url: '#' },
        { id: 'joker', name: 'Joker', icon: 'bi-lightning', url: '#' },
        { id: 'ts4k', name: 'TS4K', icon: 'bi-box', url: '#' },
        { id: 'nexon', name: 'Nexon', icon: 'bi-cpu', url: '#' },
        { id: 'region', name: 'Región', icon: 'bi-globe', url: '#' },
        { id: 'doniptv', name: 'DonIPTV', icon: 'bi-broadcast', url: '#' },
        { id: 'p2p', name: 'P2P', icon: 'bi-diagram-3', url: '#' }
    ];

    const defaultAppLinks = [
        { id: 'maxplayer', name: 'Max Player', icon: 'bi-display', url: 'https://maxplayer.xyz' },
        { id: 'ibox', name: 'iBox Player', icon: 'bi-box', url: '#' },
        { id: 'smartone', name: 'Smartone', icon: 'bi-tv', url: '#' },
        { id: 'cr7', name: 'CR7 Panel', icon: 'bi-shield', url: '#' },
        { id: 'ibo', name: 'IBO Player', icon: 'bi-play-circle', url: '#' },
        { id: 'ibosol', name: 'IBO Sol', icon: 'bi-sun', url: '#' },
        { id: 'ibolepes', name: 'IBO Lepes', icon: 'bi-controller', url: '#' },
        { id: 'donibo', name: 'DonIBO', icon: 'bi-check-circle', url: '#' },
        { id: 'thimata', name: 'Thimata VPN', icon: 'bi-key', url: '#' },
        { id: 'vuplayer', name: 'VU Player (Marine)', icon: 'bi-collection-play', url: '#' },
        { id: 'ibokiller', name: 'IBO Killer', icon: 'bi-x-circle', url: '#' },
        { id: 'xciptv', name: 'XCIPTV Phoenix', icon: 'bi-fire', url: '#' },
        { id: 'thimataph', name: 'Thimata Phoenix', icon: 'bi-lightning-charge', url: '#' }
    ];

    let customLinks = JSON.parse(localStorage.getItem('iptv_custom_urls')) || {};

    function renderButtons() {
        const iptvGrid = document.getElementById('iptvGrid');
        const appGrid = document.getElementById('appGrid');
        iptvGrid.innerHTML = '';
        appGrid.innerHTML = '';

        defaultIptvLinks.forEach(item => {
            const currentUrl = customLinks[item.id] || item.url;
            iptvGrid.appendChild(createButtonElement(item, currentUrl, false));
        });

        defaultAppLinks.forEach(item => {
            const currentUrl = customLinks[item.id] || item.url;
            appGrid.appendChild(createButtonElement(item, currentUrl, true));
        });
    }

    // Se elimina el target="_blank" para abrir enlaces en la misma pestaña
    function createButtonElement(item, url, isApp) {
        const div = document.createElement('div');
        div.className = `btn-panel ${isApp ? 'btn-app' : ''}`;
        div.innerHTML = `
            <a href="${url}" style="color:inherit; text-decoration:none; flex-grow:1;">
                <i class="bi ${item.icon} me-1"></i> ${item.name}
            </a>
            <i class="bi bi-pencil-fill btn-edit-icon" title="Editar URL" onclick="editUrl('${item.id}', '${item.name}', '${url}')"></i>
        `;
        div.oncontextmenu = (e) => {
            e.preventDefault();
            editUrl(item.id, item.name, url);
        };
        return div;
    }

    function editUrl(id, name, currentUrl) {
        const newUrl = prompt(`Introduce la nueva dirección URL para ${name}:`, currentUrl);
        if (newUrl !== null && newUrl.trim() !== "") {
            customLinks[id] = newUrl.trim();
            localStorage.setItem('iptv_custom_urls', JSON.stringify(customLinks));
            renderButtons();
        }
    }

    function resetLinks() {
        if(confirm('¿Restaurar todas las URLs predeterminadas?')) {
            localStorage.removeItem('iptv_custom_urls');
            customLinks = {};
            renderButtons();
        }
    }

    // RECUPERACIÓN AUTOMÁTICA DE CLIENTES DE TODAS LAS VERSIONES ANTERIORES
    function loadStoredClients() {
        const keys = ['iptv_clients_full', 'iptv_clients_v27', 'iptv_clients_photo', 'iptv_clients'];
        let found = [];
        for (let key of keys) {
            const data = localStorage.getItem(key);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        found = parsed;
                        break;
                    }
                } catch(e) {}
            }
        }
        return found;
    }

    let clients = loadStoredClients();

    function saveClients() {
        localStorage.setItem('iptv_clients_full', JSON.stringify(clients));
        localStorage.setItem('iptv_clients_v27', JSON.stringify(clients));
    }

    function addClient() {
        const client = {
            id: Date.now().toString(),
            name: document.getElementById('cName').value,
            user: document.getElementById('cUser').value,
            phone: document.getElementById('cPhone').value,
            app: document.getElementById('cApp').value,
            pass: document.getElementById('cPass').value,
            server: document.getElementById('cServer').value,
            mac: document.getElementById('cMac').value,
            expiry: document.getElementById('cExpiry').value,
            notes: document.getElementById('cNotes').value
        };
        clients.push(client);
        saveClients();

        sendTelegramAlert(`Nuevo cliente registrado:\nCliente: ${client.name}\nServidor: ${client.server}\nVence: ${client.expiry}`);

        document.getElementById('clientForm').reset();
        renderTable();
    }

    function sendWhatsApp(phone, name, expiry) {
        if (!phone) {
            alert("Este cliente no tiene teléfono guardado.");
            return;
        }
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const text = encodeURIComponent(`Hola ${name}, te comento que tu suscripción vence el ${expiry}. ¿Te interesa renovar? ¡Muchas gracias!`);
        window.open(`https://wa.me/${cleanPhone}?text=${text}`, '_blank');
    }

    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const query = document.getElementById('searchBox').value.toLowerCase();
        tbody.innerHTML = '';
        
        const filtered = clients.filter(c => 
            (c.name && c.name.toLowerCase().includes(query)) || 
            (c.phone && c.phone.includes(query)) ||
            (c.user && c.user.toLowerCase().includes(query)) ||
            (c.mac && c.mac.toLowerCase().includes(query)) || 
            (c.server && c.server.toLowerCase().includes(query))
        );

        document.getElementById('clientCount').innerText = filtered.length;

        filtered.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.name || '-'}</strong><br><small class="text-muted">${c.phone || '-'}</small></td>
                <td><small>User: ${c.user || '-'}<br>Pass: ${c.pass || '-'}</small></td>
                <td><span class="badge bg-primary">${c.server || '-'}</span><br><small>${c.app || '-'}</small></td>
                <td><small>${c.mac || '-'}</small></td>
                <td>${c.expiry || '-'}</td>
                <td>
                    <button class="btn btn-success btn-sm me-1" title="Enviar WhatsApp" onclick="sendWhatsApp('${c.phone}', '${c.name}', '${c.expiry}')"><i class="bi bi-whatsapp"></i></button>
                    <button class="btn btn-danger btn-sm" onclick="deleteClient('${c.id}')"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteClient(id) {
        if(confirm('¿Eliminar cliente?')) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
            renderTable();
        }
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(clients, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_iptv_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    // TELEGRAM CONFIG
    function saveTgConfig() {
        const tgData = {
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        };
        localStorage.setItem('iptv_tg_config', JSON.stringify(tgData));
    }

    function loadTgConfig() {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (tgData.token) document.getElementById('tgToken').value = tgData.token;
        if (tgData.chatId) document.getElementById('tgChatId').value = tgData.chatId;
    }

    function sendTelegramAlert(message) {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (!tgData.token || !tgData.chatId) return;

        const url = `https://api.telegram.org/bot${tgData.token}/sendMessage`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgData.chatId, text: message })
        }).catch(err => console.error("Error Telegram:", err));
    }

    renderButtons();
    loadTgConfig();
    renderTable();
</script>
</body>
</html>
