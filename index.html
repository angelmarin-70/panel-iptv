<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel IPTV & Clientes</title>

  <!-- SDK Firebase CDN v9 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js";

    // Configuración de tu base de datos en la nube
    const firebaseConfig = {
      apiKey: "AIzaSy_REEMPLAZA_CON_TU_API_KEY",
      authDomain: "tu-proyecto.firebaseapp.com",
      databaseURL: "https://tu-proyecto-default-rtdb.firebaseio.com",
      projectId: "tu-proyecto",
      storageBucket: "tu-proyecto.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef123456"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;
    window.dbRef = ref;
    window.dbSet = set;
    window.dbOnValue = onValue;
    window.dbRemove = remove;
  </script>

  <style>
    :root {
      --bg-main: #0b0f19;
      --bg-card: #131b2e;
      --bg-input: #0f172a;
      --border-color: #1e293b;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-main); color: var(--text-main); margin: 0; padding: 20px; }
    .container { max-width: 1300px; margin: 0 auto; }
    
    /* Cabecera de Estado Cloud */
    .header-cloud { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .badge-status { background: #064e3b; color: #34d399; font-size: 11px; padding: 4px 10px; border-radius: 12px; border: 1px solid #059669; font-weight: bold; }

    .card { background-color: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    .card-title { font-size: 14px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 15px; }
    
    /* Formularios */
    .grid-form { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; }
    label { display: block; font-size: 11px; font-weight: bold; color: var(--accent-blue); text-transform: uppercase; margin-bottom: 5px; }
    input, select { width: 100%; background: var(--bg-input); border: 1px solid var(--border-color); color: #fff; padding: 10px; border-radius: 4px; font-size: 13px; outline: none; }
    input:focus, select:focus { border-color: var(--accent-blue); }
    
    .form-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px; }
    .btn { padding: 9px 18px; font-size: 13px; font-weight: bold; border-radius: 4px; border: none; cursor: pointer; }
    .btn-save { background: #059669; color: white; }

    /* Tabla */
    table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; margin-top: 10px; }
    th { background: #0f172a; color: var(--accent-blue); padding: 12px 10px; border-bottom: 1px solid var(--border-color); text-transform: uppercase; font-size: 11px; }
    td { padding: 12px 10px; border-bottom: 1px solid var(--border-color); color: #e2e8f0; }
    tr:nth-child(even) { background-color: #0f172a; }
    .btn-action { background: #334155; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    .btn-delete { background: #991b1b; }
  </style>
</head>
<body>

<div class="container">

  <div class="header-cloud">
    <div style="font-size: 16px; font-weight: bold;">Panel IPTV & Clientes</div>
    <div><span class="badge-status" id="syncStatus">● Conectando a la nube...</span></div>
  </div>

  <!-- FORMULARIO DE CLIENTES -->
  <div class="card">
    <div class="card-title">Añadir / Modificar Cliente</div>
    <form id="clientForm" onsubmit="saveClient(event)">
      <input type="hidden" id="clientId">
      <div class="grid-form">
        
        <div>
          <label>Nombre del Cliente *</label>
          <input type="text" id="cNombre" placeholder="Nombre completo" required>
        </div>

        <div>
          <label>Teléfono (WhatsApp) *</label>
          <input type="text" id="cTelefono" placeholder="Ej: 34600000000" required>
        </div>

        <div>
          <label>Usuario Panel / App</label>
          <input type="text" id="cUsuario" placeholder="Usuario">
        </div>

        <div>
          <label>Contraseña</label>
          <input type="text" id="cPassword" placeholder="Contraseña">
        </div>

        <div>
          <label>Servidor / Panel IPTV</label>
          <select id="cServidor">
            <option value="">Seleccionar Servidor...</option>
            <option value="NetTV">NetTV</option>
            <option value="Emby">Emby</option>
            <option value="Zafiro">Zafiro</option>
            <option value="Dylan">Dylan</option>
            <option value="Joker">Joker</option>
            <option value="TS4K">TS4K</option>
            <option value="Nexon">Nexon</option>
            <option value="Regilón">Regilón</option>
            <option value="DonIPTV">DonIPTV</option>
            <option value="P2P">P2P</option>
          </select>
        </div>

        <div>
          <label>Aplicación Instalada</label>
          <select id="cApp">
            <option value="">Seleccionar Aplicación...</option>
            <option value="Max Player">Max Player</option>
            <option value="IBO Player">IBO Player</option>
            <option value="iBox Player">iBox Player</option>
            <option value="Smartone">Smartone</option>
            <option value="CR7 Panel">CR7 Panel</option>
            <option value="IBO Sol">IBO Sol</option>
            <option value="IBO Lopes">IBO Lopes</option>
            <option value="DonIBO">DonIBO</option>
            <option value="TiviMate VPN">TiviMate VPN</option>
            <option value="VU Player">VU Player</option>
            <option value="IBO Killer">IBO Killer</option>
            <option value="XCIPTV Phoenix">XCIPTV Phoenix</option>
            <option value="TiviMate Phoenix">TiviMate Phoenix</option>
          </select>
        </div>

        <div>
          <label>Fecha Vencimiento *</label>
          <input type="date" id="cFecha" required>
        </div>

        <div style="display: flex; align-items: flex-end;">
          <button type="submit" class="btn btn-save" style="width: 100%;">Guardar Cliente</button>
        </div>

      </div>
    </form>
  </div>

  <!-- LISTA DE CLIENTES -->
  <div class="card">
    <div class="card-title">Lista de Clientes</div>
    <table>
      <thead>
        <tr>
          <th>Cliente</th>
          <th>Teléfono</th>
          <th>Credenciales (Usuario / Pass)</th>
          <th>Servidor / App</th>
          <th>Vencimiento</th>
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody id="clientsTableBody">
        <!-- Se cargan dinámicamente -->
      </tbody>
    </table>
  </div>

</div>

<script>
  let clients = [];

  window.addEventListener('load', () => {
    if (window.db) {
      const clientsRef = window.dbRef(window.db, 'clientes');
      window.dbOnValue(clientsRef, (snapshot) => {
        const data = snapshot.val();
        clients = data ? Object.values(data) : [];
        renderClients();
        document.getElementById('syncStatusinnerText' || 'syncStatus').innerText = '● Sincronizado en la Nube';
        document.getElementById('syncStatus').style.color = '#34d399';
      }, (error) => {
        clients = JSON.parse(localStorage.getItem('iptv_clients') || '[]');
        renderClients();
        document.getElementById('syncStatus').innerText = '● Modo Local (Offline)';
        document.getElementById('syncStatus').style.color = '#f59e0b';
      });
    }
  });

  function saveClient(e) {
    e.preventDefault();
    const id = document.getElementById('clientId').value || 'cli_' + Date.now();
    const newClient = {
      id,
      nombre: document.getElementById('cNombre').value,
      telefono: document.getElementById('cTelefono').value,
      usuario: document.getElementById('cUsuario').value,
      password: document.getElementById('cPassword').value,
      servidor: document.getElementById('cServidor').value,
      app: document.getElementById('cApp').value,
      fecha: document.getElementById('cFecha').value
    };

    if (window.db) {
      window.dbSet(window.dbRef(window.db, 'clientes/' + id), newClient);
    }

    const index = clients.findIndex(c => c.id === id);
    if (index > -1) { clients[index] = newClient; } else { clients.push(newClient); }
    localStorage.setItem('iptv_clients', JSON.stringify(clients));

    document.getElementById('clientForm').reset();
    document.getElementById('clientId').value = '';
    renderClients();
  }

  function deleteClient(id) {
    if (confirm('¿Eliminar cliente?')) {
      if (window.db) {
        window.dbRemove(window.dbRef(window.db, 'clientes/' + id));
      }
      clients = clients.filter(c => c.id !== id);
      localStorage.setItem('iptv_clients', JSON.stringify(clients));
      renderClients();
    }
  }

  function renderClients() {
    const tbody = document.getElementById('clientsTableBody');
    tbody.innerHTML = '';
    if (clients.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#64748b;">No hay clientes registrados.</td></tr>`;
      return;
    }
    clients.forEach(c => {
      tbody.innerHTML += `
        <tr>
          <td><strong>${c.nombre}</strong></td>
          <td>${c.telefono}</td>
          <td><code>${c.usuario || '-'}</code> / <code style="color:#38bdf8;">${c.password || '-'}</code></td>
          <td>${c.servidor || '-'} / <small>${c.app || '-'}</small></td>
          <td>${c.fecha || '-'}</td>
          <td>
            <button class="btn-action" onclick="editClient('${c.id}')">✏️</button>
            <button class="btn-action btn-delete" onclick="deleteClient('${c.id}')">🗑️</button>
          </td>
        </tr>`;
    });
  }

  function editClient(id) {
    const c = clients.find(item => item.id === id);
    if (!c) return;
    document.getElementById('clientId').value = c.id;
    document.getElementById('cNombre').value = c.nombre;
    document.getElementById('cTelefono').value = c.telefono;
    document.getElementById('cUsuario').value = c.usuario;
    document.getElementById('cPassword').value = c.password;
    document.getElementById('cServidor').value = c.servidor;
    document.getElementById('cApp').value = c.app;
    document.getElementById('cFecha').value = c.fecha;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
</script>

</body>
</html>
