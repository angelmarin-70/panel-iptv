<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IPTV Admin - Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #0b0f19 !important;
            color: #ffffff !important;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 20px;
        }

        .section-box {
            background-color: #151c2c !important;
            border: 2px solid #2d3748 !important;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1.1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .btn-panel-box {
            background-color: #1e293b !important;
            border: 1px solid #475569 !important;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .btn-panel-box:hover {
            background-color: #334155 !important;
            border-color: #38bdf8 !important;
        }

        .btn-app-box {
            background-color: #1d4ed8 !important;
            border: 1px solid #3b82f6 !important;
        }
        .btn-app-box:hover {
            background-color: #2563eb !important;
        }

        .panel-link {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-edit-icon {
            color: #fbbf24 !important;
            font-size: 1rem;
            cursor: pointer;
        }

        label {
            color: #38bdf8 !important;
            font-weight: 800 !important;
            font-size: 0.9rem;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
        }

        .form-control, .form-select {
            background-color: #0f172a !important;
            border: 2px solid #475569 !important;
            color: #ffffff !important;
            font-size: 0.95rem !important;
            font-weight: 600 !important;
            padding: 10px !important;
        }

        .form-control:focus, .form-select:focus {
            background-color: #1e293b !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.5) !important;
        }

        ::placeholder {
            color: #94a3b8 !important;
            opacity: 1 !important;
        }

        option {
            background-color: #0f172a !important;
            color: #ffffff !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .table-custom {
            color: #ffffff !important;
            margin: 0;
        }
        .table-custom th {
            background-color: #1e293b !important;
            color: #38bdf8 !important;
            border-bottom: 2px solid #475569 !important;
            padding: 12px;
            font-weight: 800;
        }
        .table-custom td {
            background-color: #0f172a !important;
            border-bottom: 1px solid #1e293b !important;
            padding: 12px;
            vertical-align: middle;
            color: #ffffff !important;
        }

        .btn-whatsapp {
            background-color: #25d366 !important;
            color: #ffffff !important;
            font-weight: bold;
            border: none !important;
        }
        .btn-whatsapp:hover {
            background-color: #1da851 !important;
        }

        /* MODAL PANTALLA COMPLETA PARA EL BLOC DE NOTAS */
        .notepad-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(11, 15, 25, 0.98);
            z-index: 99999;
            padding: 25px;
            box-sizing: border-box;
            flex-direction: column;
        }
        .notepad-modal.active {
            display: flex;
        }
        .notepad-textarea {
            width: 100%;
            height: 100%;
            background-color: #050811 !important;
            color: #00ffcc !important;
            font-family: monospace, monospace;
            font-size: 1.1rem !important;
            padding: 20px !important;
            border: 2px solid #38bdf8 !important;
            border-radius: 8px;
            resize: none;
        }
    </style>
</head>
<body>

<div class="container-fluid max-w-7xl mx-auto">
    <!-- CABECERA -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="fw-bold m-0 text-white"><i class="bi bi-cpu-fill text-info me-2"></i>Panel IPTV Admin</h3>
        <div class="d-flex align-items-center gap-2">
            <button class="btn btn-outline-primary btn-sm" onclick="requestNotificationPermission()">
                <i class="bi bi-bell-fill"></i> Activar Notificaciones
            </button>
            <button class="btn btn-outline-warning btn-sm" onclick="resetLinks()">
                <i class="bi bi-arrow-counterclockwise"></i> Reset URLs
            </button>
            <button class="btn btn-outline-info btn-sm" onclick="document.getElementById('importFile').click()">
                <i class="bi bi-upload"></i> Cargar Copia
            </button>
            <input type="file" id="importFile" style="display:none;" onchange="importBackup(event)">
            <button class="btn btn-success btn-sm" onclick="exportBackup()">
                <i class="bi bi-download"></i> Guardar Copia
            </button>
        </div>
    </div>

    <!-- PANELES IPTV -->
    <div class="section-box">
        <div class="section-title text-info"><i class="bi bi-grid-3x3-gap-fill"></i> Paneles IPTV</div>
        <div class="btn-grid" id="iptvGrid"></div>
    </div>

    <!-- PANELES APLICACIONES -->
    <div class="section-box">
        <div class="section-title text-primary"><i class="bi bi-app-indicator"></i> Paneles de Aplicaciones</div>
        <div class="btn-grid" id="appGrid"></div>
    </div>

    <!-- SECCIÓN CONTROL DE BLOC DE NOTAS / DNS -->
    <div class="section-box">
        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
            <div class="section-title text-warning m-0">
                <i class="bi bi-journal-text me-1"></i> Bloc de Notas & DNS
            </div>
            <div class="d-flex align-items-center gap-2">
                <select class="form-select form-select-sm" id="noteCategorySelect" style="width: 240px;" onchange="changeNoteCategory()">
                    <option value="dns_iptv">🌐 DNS</option>
                    <option value="mag_portals">📺 Portales MAG / Stalker</option>
                    <option value="app_codes">🔑 Códigos & Activaciones App</option>
                    <option value="general_notes">📝 Notas Generales</option>
                </select>
                <button class="btn btn-warning btn-sm fw-bold px-3" onclick="openNotepadModal()">
                    <i class="bi bi-arrows-fullscreen me-1"></i> Abrir a Pantalla Completa
                </button>
            </div>
        </div>
    </div>

    <!-- VENTANA FLOTANTE A PANTALLA COMPLETA (BLOC DE NOTAS) -->
    <div class="notepad-modal" id="notepadModal">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="m-0 fw-bold text-warning" id="modalTitle">
                <i class="bi bi-file-earmark-code me-2"></i> Bloc de Notas - DNS
            </h4>
            <div class="d-flex gap-2">
                <button class="btn btn-outline-secondary btn-sm" onclick="clearCurrentNote()"><i class="bi bi-eraser"></i> Limpiar Texto</button>
                <button class="btn btn-success btn-sm fw-bold px-4" onclick="saveCurrentNote()"><i class="bi bi-save me-1"></i> Guardar Cambios</button>
                <button class="btn btn-danger btn-sm px-3" onclick="closeNotepadModal()"><i class="bi bi-x-lg me-1"></i> Cerrar</button>
            </div>
        </div>
        <textarea class="notepad-textarea" id="noteTextArea" placeholder="Escribe o pega aquí tus direcciones DNS, notas o claves..."></textarea>
    </div>

    <!-- BOT TELEGRAM -->
    <div class="section-box">
        <div class="section-title text-warning"><i class="bi bi-telegram"></i> Alertas por Telegram</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Telegram Bot Token</label>
                <input type="text" class="form-control" id="tgToken" placeholder="123456789:ABCdef..." onchange="saveTgConfig()">
            </div>
            <div class="col-md-6">
                <label>Telegram Chat ID</label>
                <input type="text" class="form-control" id="tgChatId" placeholder="987654321" onchange="saveTgConfig()">
            </div>
        </div>
    </div>

    <!-- REGISTRO DE CLIENTE -->
    <div class="section-box">
        <div class="section-title text-success" id="formTitle"><i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente</div>
        <form id="clientForm" onsubmit="event.preventDefault(); saveClientForm();">
            <input type="hidden" id="editClientId" value="">
            <div class="row g-3">
                <div class="col-md-3">
                    <label>Nombre del Cliente *</label>
                    <input type="text" class="form-control" id="cName" required placeholder="Nombre completo">
                </div>
                <div class="col-md-3">
                    <label>Teléfono (WhatsApp) *</label>
                    <input type="text" class="form-control" id="cPhone" required placeholder="+34612345678">
                </div>
                <div class="col-md-3">
                    <label>Usuario Panel / App</label>
                    <input type="text" class="form-control" id="cUser" placeholder="Ej: usuario123">
                </div>
                <div class="col-md-3">
                    <label>Contraseña</label>
                    <input type="text" class="form-control" id="cPass" placeholder="Ej: clave123">
                </div>
                <div class="col-md-3">
                    <label>Servidor / Panel IPTV</label>
                    <select class="form-select" id="cServer">
                        <option value="NetTV">NetTV</option>
                        <option value="Max Player">Max Player</option>
                        <option value="Emby">Emby</option>
                        <option value="Zafiro">Zafiro</option>
                        <option value="Dylan">Dylan</option>
                        <option value="Joker">Joker</option>
                        <option value="TS4K">TS4K</option>
                        <option value="Nexon">Nexon</option>
                        <option value="DonIPTV">DonIPTV</option>
                        <option value="P2P">P2P</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Aplicación Instalada</label>
                    <select class="form-select" id="cApp">
                        <option value="Max Player">Max Player</option>
                        <option value="IBO Player">IBO Player</option>
                        <option value="NetTV App">NetTV App</option>
                        <option value="iBox Player">iBox Player</option>
                        <option value="Smartone">Smartone</option>
                        <option value="VU Player">VU Player</option>
                        <option value="XCIPTV">XCIPTV</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Dirección MAC</label>
                    <input type="text" class="form-control" id="cMac" placeholder="00:1A:2B:3C:4D:5E">
                </div>
                <div class="col-md-3">
                    <label>Fecha Vencimiento *</label>
                    <input type="date" class="form-control" id="cExpiry" required>
                </div>
                <div class="col-md-12">
                    <label>Notas Adicionales</label>
                    <input type="text" class="form-control" id="cNotes" placeholder="Dispositivo, observaciones, etc.">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn btn-outline-secondary btn-sm px-3" onclick="resetForm()">Limpiar / Cancelar</button>
                <button type="submit" class="btn btn-success btn-sm px-4 fw-bold" id="btnSaveClient"><i class="bi bi-save me-1"></i> Guardar Cliente</button>
            </div>
        </form>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div class="section-box">
        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
            <div class="section-title text-warning m-0">
                <i class="bi bi-people-fill"></i> Clientes (<span id="clientCount">0</span>)
            </div>
            
            <div class="btn-group btn-group-sm" role="group">
                <button type="button" class="btn btn-outline-info active" id="filterAll" onclick="setFilter('all')">Todos</button>
                <button type="button" class="btn btn-outline-warning" id="filterToday" onclick="setFilter('today')">Vencen Hoy</button>
                <button type="button" class="btn btn-outline-primary" id="filterWeek" onclick="setFilter('week')">Esta Semana</button>
                <button type="button" class="btn btn-outline-danger" id="filterExpired" onclick="setFilter('expired')">Caducados</button>
            </div>

            <div style="width: 250px;">
                <input type="text" class="form-control form-control-sm" id="searchBox" placeholder="Buscar cliente, tel, MAC..." onkeyup="renderTable()">
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Cliente / Teléfono</th>
                        <th>Credenciales</th>
                        <th>Servidor / App</th>
                        <th>MAC</th>
                        <th>Vencimiento</th>
                        <th class="text-center">Aviso WhatsApp</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const defaultIptvLinks = [
        { id: 'nettv', name: 'NetTV', icon: 'bi-tv', url: 'https://nettv.mypannel.xyz/reseller/login.php?referrer=edit_subreseller.php?id=11100' },
        { id: 'emby', name: 'Emby', icon: 'bi-hdd-network', url: 'http://31.220.73.197:8096' },
        { id: 'zafiro', name: 'Zafiro', icon: 'bi-gem', url: 'http://panel.zafiro.pro' },
        { id: 'dylan', name: 'Dylan', icon: 'bi-play-circle', url: 'http://dylan.ott-panel.com' },
        { id: 'joker', name: 'Joker', icon: 'bi-lightning', url: 'http://joker-tv.top' },
        { id: 'ts4k', name: 'TS4K', icon: 'bi-box', url: 'http://ts4k.vip' },
        { id: 'nexon', name: 'Nexon', icon: 'bi-cpu', url: 'http://nexon.pro' },
        { id: 'region', name: 'Región', icon: 'bi-globe', url: 'http://regioniptv.com' },
        { id: 'doniptv', name: 'DonIPTV', icon: 'bi-broadcast', url: 'http://doniptv.org' },
        { id: 'p2p', name: 'P2P', icon: 'bi-diagram-3', url: 'http://p2p-panel.net' }
    ];

    const defaultAppLinks = [
        { id: 'maxplayer', name: 'Max Player', icon: 'bi-display', url: 'https://maxplayer.xyz' },
        { id: 'ibox', name: 'iBox Player', icon: 'bi-box', url: 'https://iboxplayer.com' },
        { id: 'smartone', name: 'Smartone', icon: 'bi-tv', url: 'https://smartone-iptv.com' },
        { id: 'cr7', name: 'CR7 Panel', icon: 'bi-shield', url: 'https://cr7player.com' },
        { id: 'ibo', name: 'IBO Player', icon: 'bi-play-circle', url: 'https://iboplayer.com' },
        { id: 'ibosol', name: 'IBO Sol', icon: 'bi-sun', url: 'https://ibosol.app' },
        { id: 'ibolepes', name: 'IBO Lepes', icon: 'bi-controller', url: 'https://ibolepes.com' },
        { id: 'donibo', name: 'DonIBO', icon: 'bi-check-circle', url: 'https://donibo.app' },
        { id: 'thimata', name: 'Thimata VPN', icon: 'bi-key', url: 'https://thimata.net' },
        { id: 'vuplayer', name: 'VU Player', icon: 'bi-collection-play', url: 'https://vuplayer.org' },
        { id: 'ibokiller', name: 'IBO Killer', icon: 'bi-x-circle', url: 'https://ibokiller.com' },
        { id: 'xciptv', name: 'XCIPTV Phoenix', icon: 'bi-fire', url: 'https://xciptv.com' },
        { id: 'thimataph', name: 'Thimata Phoenix', icon: 'bi-lightning-charge', url: 'https://phoenix.thimata.net' }
    ];

    let customLinks = JSON.parse(localStorage.getItem('iptv_custom_urls')) || {};
    let activeFilter = 'all';

    function renderButtons() {
        const iptvGrid = document.getElementById('iptvGrid');
        const appGrid = document.getElementById('appGrid');
        iptvGrid.innerHTML = '';
        appGrid.innerHTML = '';

        defaultIptvLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            iptvGrid.appendChild(createButtonBox(item, finalUrl, false));
        });

        defaultAppLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            appGrid.appendChild(createButtonBox(item, finalUrl, true));
        });
    }

    function createButtonBox(item, url, isApp) {
        const div = document.createElement('div');
        div.className = `btn-panel-box ${isApp ? 'btn-app-box' : ''}`;
        div.innerHTML = `
            <a href="${url}" class="panel-link" target="_blank" rel="noopener noreferrer">
                <i class="bi ${item.icon}"></i> ${item.name}
            </a>
            <i class="bi bi-pencil-fill btn-edit-icon" title="Editar URL" onclick="editUrl('${item.id}', '${item.name}', '${url}')"></i>
        `;
        return div;
    }

    function editUrl(id, name, currentUrl) {
        const newUrl = prompt(`Cambiar enlace para ${name}:`, currentUrl);
        if (newUrl !== null) {
            customLinks[id] = newUrl.trim();
            localStorage.setItem('iptv_custom_urls', JSON.stringify(customLinks));
            renderButtons();
        }
    }

    function resetLinks() {
        if(confirm('¿Restablecer los botones a las URLs por defecto?')) {
            localStorage.removeItem('iptv_custom_urls');
            customLinks = {};
            renderButtons();
        }
    }

    // --- NOTIFICACIONES DEL NAVEGADOR ---
    function requestNotificationPermission() {
        if (!("Notification" in window)) {
            alert("Este navegador no soporta notificaciones de escritorio.");
            return;
        }
        Notification.requestPermission().then(permission => {
            if (permission === "granted") {
                new Notification("Panel IPTV Admin", {
                    body: "¡Las notificaciones en el navegador están activadas!",
                    icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
                });
            } else {
                alert("Las notificaciones fueron rechazadas.");
            }
        });
    }

    function checkExpiryNotifications() {
        if (!("Notification" in window) || Notification.permission !== "granted") return;

        const todayStr = new Date().toISOString().slice(0, 10);
        const todayClients = clients.filter(c => c.expiry === todayStr);

        if (todayClients.length > 0) {
            new Notification("⚠️ Clientes Vencen Hoy", {
                body: `Tienes ${todayClients.length} cliente(s) cuya suscripción vence el día de hoy.`,
                icon: "https://cdn-icons-png.flaticon.com/512/3602/3602145.png"
            });
        }
    }

    // GESTIÓN DEL BLOC DE NOTAS PANTALLA COMPLETA
    let currentCategoryKey = 'dns_iptv';

    function openNotepadModal() {
        saveCurrentNote(false);
        currentCategoryKey = document.getElementById('noteCategorySelect').value;
        const selectText = document.getElementById('noteCategorySelect').options[document.getElementById('noteCategorySelect').selectedIndex].text;
        document.getElementById('modalTitle').innerHTML = `<i class="bi bi-file-earmark-code me-2"></i> ${selectText}`;
        loadCurrentNote();
        document.getElementById('notepadModal').classList.add('active');
    }

    function closeNotepadModal() {
        saveCurrentNote(false);
        document.getElementById('notepadModal').classList.remove('active');
    }

    function changeNoteCategory() {
        saveCurrentNote(false);
        currentCategoryKey = document.getElementById('noteCategorySelect').value;
        const selectText = document.getElementById('noteCategorySelect').options[document.getElementById('noteCategorySelect').selectedIndex].text;
        document.getElementById('modalTitle').innerHTML = `<i class="bi bi-file-earmark-code me-2"></i> ${selectText}`;
        loadCurrentNote();
    }

    function generateDnsTemplate() {
        let template = "--- LISTADO DE DNS POR SERVIDOR IPTV ---\n\n";
        defaultIptvLinks.forEach(item => {
            template += `[ ${item.name} ]\nDNS 1: \nDNS 2: \n\n`;
        });
        return template;
    }

    function loadCurrentNote() {
        const savedNotes = JSON.parse(localStorage.getItem('iptv_multi_notes')) || {};
        
        if (currentCategoryKey === 'dns_iptv' && (!savedNotes[currentCategoryKey] || savedNotes[currentCategoryKey].trim() === '')) {
            document.getElementById('noteTextArea').value = generateDnsTemplate();
        } else {
            document.getElementById('noteTextArea').value = savedNotes[currentCategoryKey] || '';
        }
    }

    function saveCurrentNote(showAlert = true) {
        const savedNotes = JSON.parse(localStorage.getItem('iptv_multi_notes')) || {};
        savedNotes[currentCategoryKey] = document.getElementById('noteTextArea').value;
        localStorage.setItem('iptv_multi_notes', JSON.stringify(savedNotes));
        if (showAlert) alert('¡Nota guardada correctamente!');
    }

    function clearCurrentNote() {
        if(confirm('¿Borrar todo el texto de esta categoría?')) {
            document.getElementById('noteTextArea').value = '';
            saveCurrentNote(false);
        }
    }

    // GESTIÓN DE CLIENTES
    function loadStoredClients() {
        const keys = ['iptv_clients_full', 'iptv_clients_v27', 'iptv_clients'];
        for (let key of keys) {
            const data = localStorage.getItem(key);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch(e) {}
            }
        }
        return [];
    }

    let clients = loadStoredClients();

    function saveClients() {
        localStorage.setItem('iptv_clients_full', JSON.stringify(clients));
    }

    function saveClientForm() {
        const editId = document.getElementById('editClientId').value;
        
        const clientData = {
            id: editId ? editId : Date.now().toString(),
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            user: document.getElementById('cUser').value,
            pass: document.getElementById('cPass').value,
            server: document.getElementById('cServer').value,
            app: document.getElementById('cApp').value,
            mac: document.getElementById('cMac').value,
            expiry: document.getElementById('cExpiry').value,
            notes: document.getElementById('cNotes').value
        };

        if (editId) {
            const index = clients.findIndex(c => c.id === editId);
            if (index !== -1) clients[index] = clientData;
        } else {
            clients.push(clientData);
            sendTelegramAlert(`🟢 *Nuevo Cliente Registrado*\n\n👤 *Cliente:* ${clientData.name}\n📱 *Tel:* ${clientData.phone}\n🖥 *Servidor:* ${clientData.server}\n📅 *Vence:* ${clientData.expiry}`);
        }

        saveClients();
        resetForm();
        renderTable();
        checkExpiryNotifications();
    }

    function editClient(id) {
        const client = clients.find(c => c.id === id);
        if (!client) return;

        document.getElementById('editClientId').value = client.id;
        document.getElementById('cName').value = client.name || '';
        document.getElementById('cPhone').value = client.phone || '';
        document.getElementById('cUser').value = client.user || '';
        document.getElementById('cPass').value = client.pass || '';
        document.getElementById('cServer').value = client.server || 'NetTV';
        document.getElementById('cApp').value = client.app || 'Max Player';
        document.getElementById('cMac').value = client.mac || '';
        document.getElementById('cExpiry').value = client.expiry || '';
        document.getElementById('cNotes').value = client.notes || '';

        document.getElementById('formTitle').innerHTML = `<i class="bi bi-pencil-square text-warning"></i> Editando a: ${client.name}`;
        document.getElementById('btnSaveClient').className = "btn btn-warning btn-sm px-4 fw-bold";
        document.getElementById('btnSaveClient').innerHTML = `<i class="bi bi-check-circle me-1"></i> Actualizar Cliente`;
        window.scrollTo({ top: document.getElementById('clientForm').offsetTop - 20, behavior: 'smooth' });
    }

    function resetForm() {
        document.getElementById('editClientId').value = '';
        document.getElementById('clientForm').reset();
        document.getElementById('formTitle').innerHTML = `<i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente`;
        document.getElementById('btnSaveClient').className = "btn btn-success btn-sm px-4 fw-bold";
        document.getElementById('btnSaveClient').innerHTML = `<i class="bi bi-save me-1"></i> Guardar Cliente`;
    }

    function setFilter(filterType) {
        activeFilter = filterType;
        document.querySelectorAll('.btn-group .btn').forEach(b => b.classList.remove('active'));
        if (filterType === 'all') document.getElementById('filterAll').classList.add('active');
        if (filterType === 'today') document.getElementById('filterToday').classList.add('active');
        if (filterType === 'week') document.getElementById('filterWeek').classList.add('active');
        if (filterType === 'expired') document.getElementById('filterExpired').classList.add('active');
        renderTable();
    }

    function sendWhatsApp(phone, name, expiry, app) {
        if (!phone || phone.trim() === '') {
            alert("No se ha registrado ningún teléfono para este cliente.");
            return;
        }
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        
        const today = new Date().toISOString().slice(0, 10);
        let msgIntro = `Buenas ${name}, te comento que la suscripción de tu servicio (${app || 'IPTV'}) `;
        
        if (expiry < today) {
            msgIntro += `caducó el día ${expiry}. ¿Te interesa renovar? Gracias.`;
        } else if (expiry === today) {
            msgIntro += `caduca HOY (${expiry}). ¿Te interesa renovar para no perder acceso? Gracias.`;
        } else {
            msgIntro += `vence el próximo ${expiry}. ¿Te gustaría gestionarla ya? Gracias.`;
        }

        const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(msgIntro)}`;
        window.open(waUrl, '_blank');
    }

    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const query = document.getElementById('searchBox').value.toLowerCase();
        tbody.innerHTML = '';

        const todayStr = new Date().toISOString().slice(0, 10);
        const nextWeek = new Date();
        nextWeek.setDate(nextWeek.getDate() + 7);
        const nextWeekStr = nextWeek.toISOString().slice(0, 10);

        let filtered = clients.filter(c => 
            (c.name && c.name.toLowerCase().includes(query)) || 
            (c.phone && c.phone.includes(query)) ||
            (c.user && c.user.toLowerCase().includes(query)) ||
            (c.mac && c.mac.toLowerCase().includes(query))
        );

        if (activeFilter === 'today') {
            filtered = filtered.filter(c => c.expiry === todayStr);
        } else if (activeFilter === 'week') {
            filtered = filtered.filter(c => c.expiry >= todayStr && c.expiry <= nextWeekStr);
        } else if (activeFilter === 'expired') {
            filtered = filtered.filter(c => c.expiry < todayStr);
        }

        document.getElementById('clientCount').innerText = filtered.length;

        filtered.forEach(c => {
            const tr = document.createElement('tr');
            
            let badgeClass = 'bg-outline-light';
            if (c.expiry < todayStr) badgeClass = 'bg-danger';
            else if (c.expiry === todayStr) badgeClass = 'bg-warning text-dark';
            else if (c.expiry <= nextWeekStr) badgeClass = 'bg-info text-dark';

            tr.innerHTML = `
                <td><strong>${c.name || '-'}</strong><br><small class="text-info">${c.phone || '-'}</small></td>
                <td><small>U: ${c.user || '-'}<br>C: ${c.pass || '-'}</small></td>
                <td><span class="badge bg-primary">${c.server || '-'}</span><br><small class="text-light">${c.app || '-'}</small></td>
                <td><small class="text-warning">${c.mac || '-'}</small></td>
                <td><span class="badge ${badgeClass}">${c.expiry || '-'}</span></td>
                <td class="text-center">
                    <button class="btn btn-whatsapp btn-sm px-3" onclick="sendWhatsApp('${c.phone}', '${c.name}', '${c.expiry}', '${c.app}')">
                        <i class="bi bi-whatsapp me-1"></i> Contactar
                    </button>
                </td>
                <td class="text-center">
                    <button class="btn btn-outline-warning btn-sm me-1" onclick="editClient('${c.id}')" title="Editar"><i class="bi bi-pencil-fill"></i></button>
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteClient('${c.id}')" title="Eliminar"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteClient(id) {
        if(confirm('¿Seguro que deseas eliminar este registro?')) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
            renderTable();
        }
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(clients, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_iptv_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data)) {
                    clients = data;
                    saveClients();
                    renderTable();
                    alert('¡Datos cargados con éxito!');
                }
            } catch(err) {
                alert('El archivo no contiene un JSON válido.');
            }
        };
        reader.readAsText(file);
    }

    function saveTgConfig() {
        const tgData = {
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        };
        localStorage.setItem('iptv_tg_config', JSON.stringify(tgData));
    }

    function loadTgConfig() {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (tgData.token) document.getElementById('tgToken').value = tgData.token;
        if (tgData.chatId) document.getElementById('tgChatId').value = tgData.chatId;
    }

    function sendTelegramAlert(message) {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (!tgData.token || !tgData.chatId) return;

        fetch(`https://api.telegram.org/bot${tgData.token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgData.chatId, text: message, parse_mode: 'Markdown' })
        }).catch(e => console.error("Error enviado a Telegram:", e));
    }

    // Inicializar app
    renderButtons();
    loadTgConfig();
    renderTable();
    
    // Comprobar alertas al iniciar la página
    setTimeout(checkExpiryNotifications, 1000);
</script>
</body>
</html>
