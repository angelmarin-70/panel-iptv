<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel de Gestión IPTV</title>
  <style>
    * { box-sizing: border-box; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 1000px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { border-bottom: 2px solid #007bff; padding-bottom: 8px; color: #007bff; margin-top: 0; }
    .grid-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
    .full-width { grid-column: span 2; }
    label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
    input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 14px; }
    
    .btn-group { display: flex; gap: 5px; margin-top: 5px; }
    .btn-group button { background: #e9ecef; color: #333; border: 1px solid #ccc; padding: 5px 10px; font-size: 12px; border-radius: 4px; cursor: pointer; }
    .btn-group button:hover { background: #dee2e6; }

    .btn-submit { background: #007bff; color: white; padding: 12px 20px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; width: 100%; font-weight: bold; }
    .btn-submit:hover { background: #0056b3; }

    table { width: 100%; border-collapse: collapse; margin-top: 25px; font-size: 14px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
    th { background: #f8f9fa; color: #007bff; }
    tr:nth-child(even) { background-color: #f9f9f9; }

    .btn-danger { background: #dc3545; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; }
    .btn-ws { background: #25d366; color: white; border: none; padding: 5px 8px; border-radius: 3px; cursor: pointer; font-size: 12px; text-decoration: none; display: inline-block; }
  </style>
</head>
<body>

<div class="container">
  <h2>Registrar Cliente IPTV</h2>
  <form id="clientForm">
    <div class="grid-form">
      <!-- FILA 1 -->
      <div>
        <label for="nombre">Nombre del Cliente:</label>
        <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
      </div>

      <div>
        <label for="telefono">Teléfono (con prefijo):</label>
        <input type="tel" id="telefono" placeholder="Ej: 34600000000">
      </div>

      <!-- FILA 2: MAC Y FECHA DE VENCIMIENTO ARRIBA -->
      <div>
        <label for="mac">Dirección MAC:</label>
        <input type="text" id="mac" placeholder="Ej: 00:1A:79:XX:XX:XX" maxlength="17">
      </div>

      <div>
        <label for="vencimiento">Fecha de Vencimiento:</label>
        <input type="date" id="vencimiento" required>
        <div class="btn-group">
          <button type="button" onclick="sumarTiempo(1)">+1 Mes</button>
          <button type="button" onclick="sumarTiempo(3)">+3 Meses</button>
          <button type="button" onclick="sumarTiempo(6)">+6 Meses</button>
          <button type="button" onclick="sumarTiempo(12)">+1 Año</button>
        </div>
      </div>

      <!-- FILA 3: DEVICE Y APLICACIÓN ABAJO -->
      <div>
        <label for="device">Device / Dispositivo:</label>
        <input type="text" id="device" placeholder="Ej: Fire Stick, Smart TV LG, MAG...">
      </div>

      <div>
        <label for="app">Aplicación / Panel:</label>
        <input type="text" id="app" placeholder="Ej: Max Player, TiviMate, IBO Player...">
      </div>

      <div class="full-width">
        <label for="notas">Notas / DNS / Observaciones:</label>
        <textarea id="notas" rows="2" placeholder="Anotaciones técnicas, DNS del servidor, usuario, contraseña..."></textarea>
      </div>
    </div>

    <button type="submit" class="btn-submit">Guardar Cliente</button>
  </form>

  <h2>Clientes Registrados</h2>
  <table id="tablaClientes">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Dirección MAC</th>
        <th>Device</th>
        <th>Vencimiento</th>
        <th>App / Panel</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="listaClientes">
      <!-- Se agregan clientes guardados dinámicamente -->
    </tbody>
  </table>
</div>

<script>
  let clientes = JSON.parse(localStorage.getItem('iptv_clientes')) || [];

  // Poner dos puntos (:) automáticamente en la dirección MAC mientras se escribe
  document.getElementById('mac').addEventListener('input', function (e) {
    let value = e.target.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    let formattedValue = value.match(/.{1,2}/g)?.join(':') || '';
    e.target.value = formattedValue.slice(0, 17);
  });

  // Sumar meses automáticamente a la fecha de vencimiento
  function sumarTiempo(meses) {
    let fecha = new Date();
    fecha.setMonth(fecha.getMonth() + meses);
    document.getElementById('vencimiento').value = fecha.toISOString().split('T')[0];
  }

  // Renderizar la lista de clientes en la tabla
  function renderClientes() {
    const lista = document.getElementById('listaClientes');
    lista.innerHTML = '';

    clientes.forEach((cliente, index) => {
      const tr = document.createElement('tr');
      
      const mensajeWs = encodeURIComponent(`Hola ${cliente.nombre}, te informamos que tu suscripción vence el día ${cliente.vencimiento}. ¿Te interesa renovar? ¡Gracias!`);
      const linkWs = cliente.telefono ? `https://wa.me/${cliente.telefono}?text=${mensajeWs}` : '#';

      tr.innerHTML = `
        <td><strong>${cliente.nombre}</strong></td>
        <td>${cliente.mac || '-'}</td>
        <td>${cliente.device || '-'}</td>
        <td>${cliente.vencimiento}</td>
        <td>${cliente.app || '-'}</td>
        <td>
          ${cliente.telefono ? `<a href="${linkWs}" target="_blank" class="btn-ws">WhatsApp</a>` : ''}
          <button class="btn-danger" onclick="eliminarCliente(${index})">Borrar</button>
        </td>
      `;
      lista.appendChild(tr);
    });
  }

  // Registrar e ingresar nuevo cliente
  document.getElementById('clientForm').addEventListener('submit', function(e) {
    e.preventDefault();

    const nuevoCliente = {
      nombre: document.getElementById('nombre').value,
      telefono: document.getElementById('telefono').value,
      mac: document.getElementById('mac').value,
      vencimiento: document.getElementById('vencimiento').value,
      device: document.getElementById('device').value,
      app: document.getElementById('app').value,
      notas: document.getElementById('notas').value
    };

    clientes.push(nuevoCliente);
    localStorage.setItem('iptv_clientes', JSON.stringify(clientes));
    
    renderClientes();
    this.reset();
  });

  // Borrar cliente
  function eliminarCliente(index) {
    if (confirm('¿Deseas eliminar este cliente?')) {
      clientes.splice(index, 1);
      localStorage.setItem('iptv_clientes', JSON.stringify(clientes));
      renderClientes();
    }
  }

  // Cargar lista al abrir la página
  renderClientes();
</script>

</body>
</html>
