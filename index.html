<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Gestor IPTV</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .badge-status { font-size: 0.85em; padding: 0.4em 0.6em; }
        .mac-input { font-family: monospace; text-transform: uppercase; }
        .note-category-btn { margin-right: 5px; margin-bottom: 5px; }
    </style>
</head>
<body>

<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2><i class="fa-solid fa-tv text-primary me-2"></i>Gestión de Clientes IPTV</h2>
        <div>
            <button class="btn btn-outline-success me-2" onclick="exportBackup()"><i class="fa-solid fa-download me-1"></i> Exportar Backup</button>
            <label class="btn btn-outline-primary mb-0">
                <i class="fa-solid fa-upload me-1"></i> Importar Backup
                <input type="file" id="importFile" onchange="importBackup(event)" accept=".json" hidden>
            </label>
        </div>
    </div>

    <!-- Panel Superior: Agregar Cliente y Filtros -->
    <div class="row g-3 mb-4">
        <div class="col-lg-8">
            <div class="card p-3">
                <h5 class="card-title mb-3"><i class="fa-solid fa-user-plus me-2"></i>Nuevo / Editar Cliente</h5>
                <form id="clientForm" onsubmit="handleFormSubmit(event)" class="row g-2">
                    <input type="hidden" id="clientId">
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="clientName" placeholder="Nombre del Cliente" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="clientUser" placeholder="Usuario / ID" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="clientPass" placeholder="Contraseña">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control mac-input" id="clientMac" placeholder="MAC Address (00:1A:...)">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="clientKey" placeholder="Device Key / App ID">
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" id="clientDns" placeholder="URL DNS / Server">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small mb-1">Fecha Expiración</label>
                        <input type="date" class="form-control" id="clientExpire" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label small mb-1">Panel / Servidor Reseller</label>
                        <input type="text" class="form-control" id="clientPanel" placeholder="Ej: MaxPlayer, Zafiro...">
                    </div>
                    <div class="col-12 mt-3 text-end">
                        <button type="button" class="btn btn-secondary me-2" onclick="resetForm()">Limpiar</button>
                        <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk me-1"></i> Guardar Cliente</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Bloc de Notas por Categorías -->
        <div class="col-lg-4">
            <div class="card p-3 h-100">
                <h5 class="card-title mb-2"><i class="fa-solid fa-note-sticky me-2"></i>Notas / Respuestas Rápidas</h5>
                <div id="categoryButtons" class="mb-2"></div>
                <textarea id="noteContent" class="form-control mb-2" rows="4" placeholder="Escribe notas aquí..."></textarea>
                <button class="btn btn-sm btn-primary w-100" onclick="saveCurrentNote()"><i class="fa-solid fa-save me-1"></i> Guardar Nota</button>
            </div>
        </div>
    </div>

    <!-- Configuración de Telegram -->
    <div class="card p-3 mb-4">
        <div class="row align-items-center">
            <div class="col-md-4">
                <h6 class="mb-0"><i class="fa-brands fa-telegram text-info me-2"></i>Notificaciones Telegram</h6>
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" id="tgToken" placeholder="Bot Token">
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control form-control-sm" id="tgChatId" placeholder="Chat ID">
            </div>
            <div class="col-md-2">
                <button class="btn btn-sm btn-outline-info w-100" onclick="saveTgConfig()">Guardar Bot</button>
            </div>
        </div>
    </div>

    <!-- Tabla de Clientes -->
    <div class="card p-3">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="card-title mb-0"><i class="fa-solid fa-users me-2"></i>Lista de Clientes</h5>
            <input type="text" class="form-control w-25" id="searchInput" onkeyup="renderTable()" placeholder="Buscar cliente, usuario, MAC...">
        </div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead class="table-light">
                    <tr>
                        <th>Cliente</th>
                        <th>Credenciales</th>
                        <th>Dispositivo / MAC</th>
                        <th>Vencimiento</th>
                        <th>Estado</th>
                        <th>Panel</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                    <!-- Se genera dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Inicialización de Firebase (Coloca tus credenciales si usas Firebase externo)
    const firebaseConfig = {
        apiKey: "YOUR_API_KEY",
        authDomain: "YOUR_PROJECT.firebaseapp.com",
        databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
        projectId: "YOUR_PROJECT",
        storageBucket: "YOUR_PROJECT.appspot.com",
        messagingSenderId: "123456789",
        appId: "1:123456789:web:abcdef"
    };

    let db;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();
    } catch (e) {
        console.warn("Firebase no está configurado totalmente o trabaja en modo desconectado.", e);
    }

    // Persistencia Local Inmediata
    let clients = JSON.parse(localStorage.getItem('iptv_clients')) || [];
    let currentNoteCategory = 'General';
    const DEFAULT_TG_TOKEN = '';
    const DEFAULT_TG_CHAT_ID = '';

    function saveClientsLocal() {
        localStorage.setItem('iptv_clients', JSON.stringify(clients));
    }

    function saveClients() {
        saveClientsLocal();
        if (db) {
            db.ref('iptv_clients').set(clients).catch(err => console.error("Error al sincronizar con Firebase:", err));
        }
    }

    function initFirebase() {
        if (!db) return;
        db.ref('iptv_clients').on('value', (snapshot) => {
            const data = snapshot.val();
            if (data && Array.isArray(data)) {
                clients = data;
                saveClientsLocal();
                renderTable();
            }
        }, (error) => {
            console.error("Error en Firebase:", error);
        });
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const id = document.getElementById('clientId').value || Date.now().toString();
        const name = document.getElementById('clientName').value.trim();
        const user = document.getElementById('clientUser').value.trim();
        const pass = document.getElementById('clientPass').value.trim();
        const mac = document.getElementById('clientMac').value.trim().toUpperCase();
        const key = document.getElementById('clientKey').value.trim();
        const dns = document.getElementById('clientDns').value.trim();
        const expire = document.getElementById('clientExpire').value;
        const panel = document.getElementById('clientPanel').value.trim();

        const index = clients.findIndex(c => c.id === id);
        const newClient = { id, name, user, pass, mac, key, dns, expire, panel };

        if (index > -1) {
            clients[index] = newClient;
        } else {
            clients.push(newClient);
            sendTelegramAlert(`➕ *Nuevo Cliente Registrado*\n*Nombre:* ${name}\n*Usuario:* \`${user}\`\n*Vence:* ${expire}`);
        }

        saveClients();
        renderTable();
        resetForm();
    }

    function editClient(id) {
        const c = clients.find(item => item.id === id);
        if (!c) return;
        document.getElementById('clientId').value = c.id;
        document.getElementById('clientName').value = c.name;
        document.getElementById('clientUser').value = c.user;
        document.getElementById('clientPass').value = c.pass || '';
        document.getElementById('clientMac').value = c.mac || '';
        document.getElementById('clientKey').value = c.key || '';
        document.getElementById('clientDns').value = c.dns || '';
        document.getElementById('clientExpire').value = c.expire;
        document.getElementById('clientPanel').value = c.panel || '';
    }

    function deleteClient(id) {
        if (confirm('¿Estás seguro de eliminar este cliente?')) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
            renderTable();
        }
    }

    function resetForm() {
        document.getElementById('clientId').value = '';
        document.getElementById('clientForm').reset();
    }

    function getStatus(expireDate) {
        const today = new Date();
        today.setHours(0,0,0,0);
        const exp = new Date(expireDate);
        exp.setHours(0,0,0,0);
        
        const diffDays = Math.ceil((exp - today) / (1000 * 60 * 60 * 24));

        if (diffDays < 0) return { label: 'Vencido', class: 'bg-danger' };
        if (diffDays <= 3) return { label: `Vence en ${diffDays}d`, class: 'bg-warning text-dark' };
        return { label: 'Activo', class: 'bg-success' };
    }

    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const query = document.getElementById('searchInput').value.toLowerCase();
        tbody.innerHTML = '';

        const filtered = clients.filter(c => 
            c.name.toLowerCase().includes(query) ||
            c.user.toLowerCase().includes(query) ||
            (c.mac && c.mac.toLowerCase().includes(query)) ||
            (c.panel && c.panel.toLowerCase().includes(query))
        );

        filtered.forEach(c => {
            const st = getStatus(c.expire);
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.name}</strong></td>
                <td>
                    <small>User: <code>${c.user}</code></small><br>
                    ${c.pass ? `<small>Pass: <code>${c.pass}</code></small>` : ''}
                </td>
                <td>
                    ${c.mac ? `<small>MAC: <code>${c.mac}</code></small><br>` : ''}
                    ${c.key ? `<small>Key: <code>${c.key}</code></small>` : '-'}
                </td>
                <td>${c.expire}</td>
                <td><span class="badge ${st.class} badge-status">${st.label}</span></td>
                <td>${c.panel || '-'}</td>
                <td>
                    <button class="btn btn-sm btn-outline-primary" onclick="editClient('${c.id}')"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn btn-sm btn-outline-danger" onclick="deleteClient('${c.id}')"><i class="fa-solid fa-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // Notas por Categoría
    const categories = ['General', 'Cuentas', 'Plantillas'];
    function renderButtons() {
        const container = document.getElementById('categoryButtons');
        container.innerHTML = '';
        categories.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = `btn btn-sm ${currentNoteCategory === cat ? 'btn-secondary' : 'btn-outline-secondary'} note-category-btn`;
            btn.innerText = cat;
            btn.onclick = () => { currentNoteCategory = cat; renderButtons(); loadCurrentNote(); };
            container.appendChild(btn);
        });
    }

    function loadCurrentNote() {
        const notes = JSON.parse(localStorage.getItem('iptv_notes')) || {};
        document.getElementById('noteContent').value = notes[currentNoteCategory] || '';
    }

    function saveCurrentNote() {
        const notes = JSON.parse(localStorage.getItem('iptv_notes')) || {};
        notes[currentNoteCategory] = document.getElementById('noteContent').value;
        localStorage.setItem('iptv_notes', JSON.stringify(notes));
        alert('Nota guardada');
    }

    // Backup JSON
    function exportBackup() {
        const dataStr = JSON.stringify(clients, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_clientes_iptv_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const importedData = JSON.parse(e.target.result);
                if (Array.isArray(importedData)) {
                    if (confirm(`¿Importar ${importedData.length} clientes? Se combinarán con tus datos actuales.`)) {
                        const existingIds = new Set(clients.map(c => c.id));
                        importedData.forEach(item => {
                            if (!item.id || existingIds.has(item.id)) {
                                item.id = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                            }
                            clients.push(item);
                        });
                        saveClients();
                        renderTable();
                        alert('Importación completada con éxito.');
                    }
                } else {
                    alert('Formato JSON no válido.');
                }
            } catch (err) {
                alert('Error al leer el archivo JSON.');
            }
        };
        reader.readAsText(file);
    }

    // Telegram
    function saveTgConfig() {
        const token = document.getElementById('tgToken').value.trim();
        const chatId = document.getElementById('tgChatId').value.trim();
        localStorage.setItem('iptv_tg_config', JSON.stringify({ token, chatId }));
        alert('Configuración de Telegram guardada.');
    }

    function sendTelegramAlert(message) {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || { token: DEFAULT_TG_TOKEN, chatId: DEFAULT_TG_CHAT_ID };
        if (!tgData.token || !tgData.chatId) return;

        const url = `https://api.telegram.org/bot${tgData.token}/sendMessage`;
        fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: tgData.chatId,
                text: message,
                parse_mode: 'Markdown'
            })
        }).catch(err => console.error("Error enviando alerta a Telegram:", err));
    }

    window.onload = function() {
        renderButtons();
        loadCurrentNote();
        
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config'));
        if (tgData) {
            if (tgData.token) document.getElementById('tgToken').value = tgData.token;
            if (tgData.chatId) document.getElementById('tgChatId').value = tgData.chatId;
        }

        renderTable();
        initFirebase();
    };
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
