<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel IPTV - Apertura en Nuevas Pestañas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        html, body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: system-ui, -apple-system, sans-serif;
            padding: 15px;
        }

        .section-box {
            background-color: #111111 !important;
            border: 2px solid #333333 !important;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .btn-panel-box {
            background-color: #1e293b !important;
            border: 1px solid #475569 !important;
            border-radius: 8px;
            padding: 10px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
        }
        .btn-panel-box:hover {
            background-color: #334155 !important;
            border-color: #38bdf8 !important;
        }

        .btn-app-box {
            background-color: #1d4ed8 !important;
            border: 1px solid #3b82f6 !important;
        }
        .btn-app-box:hover {
            background-color: #2563eb !important;
        }

        .panel-link {
            color: #ffffff !important;
            text-decoration: none !important;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
        }

        .btn-edit-icon {
            color: #fbbf24 !important;
            font-size: 0.9rem;
            padding: 2px 6px;
            cursor: pointer;
        }

        label {
            color: #f3f4f6 !important;
            font-weight: 700 !important;
            font-size: 0.85rem;
            margin-bottom: 6px;
        }

        .form-control, .form-select {
            background-color: #1a1a1a !important;
            border: 1px solid #555555 !important;
            color: #ffffff !important;
            font-size: 0.9rem !important;
            font-weight: 500;
        }
        .form-control:focus, .form-select:focus {
            background-color: #222222 !important;
            border-color: #38bdf8 !important;
            color: #ffffff !important;
            box-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
        }
        .form-control::placeholder {
            color: #888888 !important;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
        }

        .table-custom {
            color: #ffffff !important;
            margin: 0;
        }
        .table-custom th {
            background-color: #222222 !important;
            color: #38bdf8 !important;
            border-bottom: 2px solid #444444 !important;
            padding: 12px;
        }
        .table-custom td {
            background-color: #111111 !important;
            border-bottom: 1px solid #222222 !important;
            padding: 12px;
            vertical-align: middle;
            color: #ffffff !important;
        }

        .btn-whatsapp {
            background-color: #25d366 !important;
            color: #ffffff !important;
            font-weight: bold;
            border: none !important;
        }
        .btn-whatsapp:hover {
            background-color: #1da851 !important;
            color: #ffffff !important;
        }
    </style>
</head>
<body>

<div class="container-fluid max-w-7xl mx-auto">
    <!-- CABECERA -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold m-0 text-white"><i class="bi bi-cpu-fill text-info me-2"></i>Panel IPTV Admin</h4>
        <div>
            <button class="btn btn-outline-warning btn-sm me-2" onclick="resetLinks()"><i class="bi bi-arrow-counterclockwise"></i> Reset URLs</button>
            <button class="btn btn-outline-info btn-sm me-2" onclick="document.getElementById('importFile').click()"><i class="bi bi-upload"></i> Cargar Copia</button>
            <input type="file" id="importFile" style="display:none;" onchange="importBackup(event)">
            <button class="btn btn-success btn-sm" onclick="exportBackup()"><i class="bi bi-download"></i> Guardar Copia</button>
        </div>
    </div>

    <!-- PANELES IPTV -->
    <div class="section-box">
        <div class="section-title text-info"><i class="bi bi-grid-3x3-gap-fill"></i> Paneles IPTV</div>
        <div class="btn-grid" id="iptvGrid"></div>
    </div>

    <!-- PANELES APLICACIONES -->
    <div class="section-box">
        <div class="section-title text-primary"><i class="bi bi-app-indicator"></i> Paneles de Aplicaciones</div>
        <div class="btn-grid" id="appGrid"></div>
    </div>

    <!-- BOT TELEGRAM -->
    <div class="section-box">
        <div class="section-title text-warning"><i class="bi bi-telegram"></i> Alertas por Telegram</div>
        <div class="row g-3">
            <div class="col-md-6">
                <label>Telegram Bot Token</label>
                <input type="text" class="form-control" id="tgToken" placeholder="123456789:ABCdef..." onchange="saveTgConfig()">
            </div>
            <div class="col-md-6">
                <label>Telegram Chat ID</label>
                <input type="text" class="form-control" id="tgChatId" placeholder="987654321" onchange="saveTgConfig()">
            </div>
        </div>
    </div>

    <!-- REGISTRO DE CLIENTE -->
    <div class="section-box">
        <div class="section-title text-success"><i class="bi bi-person-plus-fill"></i> Registrar Nuevo Cliente</div>
        <form id="clientForm" onsubmit="event.preventDefault(); addClient();">
            <div class="row g-3">
                <div class="col-md-3">
                    <label>Nombre del Cliente *</label>
                    <input type="text" class="form-control" id="cName" required placeholder="Nombre completo">
                </div>
                <div class="col-md-3">
                    <label>Teléfono (WhatsApp) *</label>
                    <input type="text" class="form-control" id="cPhone" required placeholder="+34612345678">
                </div>
                <div class="col-md-3">
                    <label>Usuario Panel / App</label>
                    <input type="text" class="form-control" id="cUser" placeholder="Ej: usuario123">
                </div>
                <div class="col-md-3">
                    <label>Contraseña</label>
                    <input type="text" class="form-control" id="cPass" placeholder="Ej: clave123">
                </div>
                <div class="col-md-3">
                    <label>Servidor / Panel IPTV</label>
                    <select class="form-select" id="cServer">
                        <option value="NetTV">NetTV</option>
                        <option value="Max Player">Max Player</option>
                        <option value="Emby">Emby</option>
                        <option value="Zafiro">Zafiro</option>
                        <option value="Dylan">Dylan</option>
                        <option value="Joker">Joker</option>
                        <option value="TS4K">TS4K</option>
                        <option value="Nexon">Nexon</option>
                        <option value="DonIPTV">DonIPTV</option>
                        <option value="P2P">P2P</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Aplicación Instalada</label>
                    <select class="form-select" id="cApp">
                        <option value="Max Player">Max Player</option>
                        <option value="IBO Player">IBO Player</option>
                        <option value="NetTV App">NetTV App</option>
                        <option value="iBox Player">iBox Player</option>
                        <option value="Smartone">Smartone</option>
                        <option value="VU Player">VU Player</option>
                        <option value="XCIPTV">XCIPTV</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label>Dirección MAC</label>
                    <input type="text" class="form-control" id="cMac" placeholder="00:1A:2B:3C:4D:5E">
                </div>
                <div class="col-md-3">
                    <label>Fecha Vencimiento *</label>
                    <input type="date" class="form-control" id="cExpiry" required>
                </div>
                <div class="col-md-12">
                    <label>Notas Adicionales</label>
                    <input type="text" class="form-control" id="cNotes" placeholder="Dispositivo, observaciones, etc.">
                </div>
            </div>
            <div class="d-flex justify-content-end gap-2 mt-3">
                <button type="button" class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('clientForm').reset()">Limpiar</button>
                <button type="submit" class="btn btn-success btn-sm px-4"><i class="bi bi-save me-1"></i> Guardar Cliente</button>
            </div>
        </form>
    </div>

    <!-- LISTA DE CLIENTES -->
    <div class="section-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="section-title text-warning m-0"><i class="bi bi-people-fill"></i> Clientes Registrados (<span id="clientCount">0</span>)</div>
            <div style="width: 280px;">
                <input type="text" class="form-control form-control-sm" id="searchBox" placeholder="Buscar por nombre, tel, MAC..." onkeyup="renderTable()">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-custom">
                <thead>
                    <tr>
                        <th>Cliente / Teléfono</th>
                        <th>Credenciales</th>
                        <th>Servidor / App</th>
                        <th>MAC</th>
                        <th>Vencimiento</th>
                        <th class="text-center">Aviso WhatsApp</th>
                        <th class="text-center">Acciones</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const defaultIptvLinks = [
        { id: 'nettv', name: 'NetTV', icon: 'bi-tv', url: 'https://nettv.mypannel.xyz/reseller/login.php?referrer=edit_subreseller.php?id=11100' },
        { id: 'emby', name: 'Emby', icon: 'bi-hdd-network', url: 'http://31.220.73.197:8096' },
        { id: 'zafiro', name: 'Zafiro', icon: 'bi-gem', url: 'http://panel.zafiro.pro' },
        { id: 'dylan', name: 'Dylan', icon: 'bi-play-circle', url: 'http://dylan.ott-panel.com' },
        { id: 'joker', name: 'Joker', icon: 'bi-lightning', url: 'http://joker-tv.top' },
        { id: 'ts4k', name: 'TS4K', icon: 'bi-box', url: 'http://ts4k.vip' },
        { id: 'nexon', name: 'Nexon', icon: 'bi-cpu', url: 'http://nexon.pro' },
        { id: 'region', name: 'Región', icon: 'bi-globe', url: 'http://regioniptv.com' },
        { id: 'doniptv', name: 'DonIPTV', icon: 'bi-broadcast', url: 'http://doniptv.org' },
        { id: 'p2p', name: 'P2P', icon: 'bi-diagram-3', url: 'http://p2p-panel.net' }
    ];

    const defaultAppLinks = [
        { id: 'maxplayer', name: 'Max Player', icon: 'bi-display', url: 'https://maxplayer.xyz' },
        { id: 'ibox', name: 'iBox Player', icon: 'bi-box', url: 'https://iboxplayer.com' },
        { id: 'smartone', name: 'Smartone', icon: 'bi-tv', url: 'https://smartone-iptv.com' },
        { id: 'cr7', name: 'CR7 Panel', icon: 'bi-shield', url: 'https://cr7player.com' },
        { id: 'ibo', name: 'IBO Player', icon: 'bi-play-circle', url: 'https://iboplayer.com' },
        { id: 'ibosol', name: 'IBO Sol', icon: 'bi-sun', url: 'https://ibosol.app' },
        { id: 'ibolepes', name: 'IBO Lepes', icon: 'bi-controller', url: 'https://ibolepes.com' },
        { id: 'donibo', name: 'DonIBO', icon: 'bi-check-circle', url: 'https://donibo.app' },
        { id: 'thimata', name: 'Thimata VPN', icon: 'bi-key', url: 'https://thimata.net' },
        { id: 'vuplayer', name: 'VU Player', icon: 'bi-collection-play', url: 'https://vuplayer.org' },
        { id: 'ibokiller', name: 'IBO Killer', icon: 'bi-x-circle', url: 'https://ibokiller.com' },
        { id: 'xciptv', name: 'XCIPTV Phoenix', icon: 'bi-fire', url: 'https://xciptv.com' },
        { id: 'thimataph', name: 'Thimata Phoenix', icon: 'bi-lightning-charge', url: 'https://phoenix.thimata.net' }
    ];

    let customLinks = JSON.parse(localStorage.getItem('iptv_custom_urls')) || {};

    function renderButtons() {
        const iptvGrid = document.getElementById('iptvGrid');
        const appGrid = document.getElementById('appGrid');
        iptvGrid.innerHTML = '';
        appGrid.innerHTML = '';

        defaultIptvLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            iptvGrid.appendChild(createButtonBox(item, finalUrl, false));
        });

        defaultAppLinks.forEach(item => {
            const finalUrl = customLinks[item.id] || item.url;
            appGrid.appendChild(createButtonBox(item, finalUrl, true));
        });
    }

    /* CAMBIO A ABRIR EN PESTAÑA NUEVA: target="_blank" rel="noopener noreferrer" */
    function createButtonBox(item, url, isApp) {
        const div = document.createElement('div');
        div.className = `btn-panel-box ${isApp ? 'btn-app-box' : ''}`;
        div.innerHTML = `
            <a href="${url}" class="panel-link" target="_blank" rel="noopener noreferrer">
                <i class="bi ${item.icon}"></i> ${item.name}
            </a>
            <i class="bi bi-pencil-fill btn-edit-icon" title="Editar URL" onclick="editUrl('${item.id}', '${item.name}', '${url}')"></i>
        `;
        return div;
    }

    function editUrl(id, name, currentUrl) {
        const newUrl = prompt(`Cambiar enlace para ${name}:`, currentUrl);
        if (newUrl !== null) {
            customLinks[id] = newUrl.trim();
            localStorage.setItem('iptv_custom_urls', JSON.stringify(customLinks));
            renderButtons();
        }
    }

    function resetLinks() {
        if(confirm('¿Restablecer los botones a las URLs por defecto?')) {
            localStorage.removeItem('iptv_custom_urls');
            customLinks = {};
            renderButtons();
        }
    }

    function loadStoredClients() {
        const keys = ['iptv_clients_full', 'iptv_clients_v27', 'iptv_clients'];
        for (let key of keys) {
            const data = localStorage.getItem(key);
            if (data) {
                try {
                    const parsed = JSON.parse(data);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed;
                } catch(e) {}
            }
        }
        return [];
    }

    let clients = loadStoredClients();

    function saveClients() {
        localStorage.setItem('iptv_clients_full', JSON.stringify(clients));
    }

    function addClient() {
        const client = {
            id: Date.now().toString(),
            name: document.getElementById('cName').value,
            phone: document.getElementById('cPhone').value,
            user: document.getElementById('cUser').value,
            pass: document.getElementById('cPass').value,
            server: document.getElementById('cServer').value,
            app: document.getElementById('cApp').value,
            mac: document.getElementById('cMac').value,
            expiry: document.getElementById('cExpiry').value,
            notes: document.getElementById('cNotes').value
        };
        clients.push(client);
        saveClients();

        sendTelegramAlert(`🟢 *Nuevo Cliente Registrado*\n\n👤 *Cliente:* ${client.name}\n📱 *Tel:* ${client.phone}\n🖥 *Servidor:* ${client.server}\n📅 *Vence:* ${client.expiry}`);

        document.getElementById('clientForm').reset();
        renderTable();
    }

    function sendWhatsApp(phone, name, expiry, app) {
        if (!phone || phone.trim() === '') {
            alert("No se ha registrado ningún teléfono para este cliente.");
            return;
        }
        const cleanPhone = phone.replace(/[^0-9]/g, '');
        const message = `Buenas, te caduca la aplicación ${app || ''} el día ${expiry}, ¿te interesa renovar? Gracias.`;
        const waUrl = `https://wa.me/${cleanPhone}?text=${encodeURIComponent(message)}`;
        window.open(waUrl, '_blank');
    }

    function renderTable() {
        const tbody = document.getElementById('clientTableBody');
        const query = document.getElementById('searchBox').value.toLowerCase();
        tbody.innerHTML = '';

        const filtered = clients.filter(c => 
            (c.name && c.name.toLowerCase().includes(query)) || 
            (c.phone && c.phone.includes(query)) ||
            (c.user && c.user.toLowerCase().includes(query)) ||
            (c.mac && c.mac.toLowerCase().includes(query))
        );

        document.getElementById('clientCount').innerText = filtered.length;

        filtered.forEach(c => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><strong>${c.name || '-'}</strong><br><small class="text-info">${c.phone || '-'}</small></td>
                <td><small>U: ${c.user || '-'}<br>C: ${c.pass || '-'}</small></td>
                <td><span class="badge bg-primary">${c.server || '-'}</span><br><small class="text-light">${c.app || '-'}</small></td>
                <td><small class="text-warning">${c.mac || '-'}</small></td>
                <td><span class="badge bg-outline-light">${c.expiry || '-'}</span></td>
                <td class="text-center">
                    <button class="btn btn-whatsapp btn-sm px-3" onclick="sendWhatsApp('${c.phone}', '${c.name}', '${c.expiry}', '${c.app}')">
                        <i class="bi bi-whatsapp me-1"></i> Contactar
                    </button>
                </td>
                <td class="text-center">
                    <button class="btn btn-outline-danger btn-sm" onclick="deleteClient('${c.id}')"><i class="bi bi-trash"></i></button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function deleteClient(id) {
        if(confirm('¿Seguro que deseas eliminar este registro?')) {
            clients = clients.filter(c => c.id !== id);
            saveClients();
            renderTable();
        }
    }

    function exportBackup() {
        const blob = new Blob([JSON.stringify(clients, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `backup_iptv_${new Date().toISOString().slice(0,10)}.json`;
        a.click();
    }

    function importBackup(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data)) {
                    clients = data;
                    saveClients();
                    renderTable();
                    alert('¡Datos cargados con éxito!');
                }
            } catch(err) {
                alert('El archivo no contiene un JSON válido.');
            }
        };
        reader.readAsText(file);
    }

    function saveTgConfig() {
        const tgData = {
            token: document.getElementById('tgToken').value,
            chatId: document.getElementById('tgChatId').value
        };
        localStorage.setItem('iptv_tg_config', JSON.stringify(tgData));
    }

    function loadTgConfig() {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (tgData.token) document.getElementById('tgToken').value = tgData.token;
        if (tgData.chatId) document.getElementById('tgChatId').value = tgData.chatId;
    }

    function sendTelegramAlert(message) {
        const tgData = JSON.parse(localStorage.getItem('iptv_tg_config')) || {};
        if (!tgData.token || !tgData.chatId) return;

        fetch(`https://api.telegram.org/bot${tgData.token}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ chat_id: tgData.chatId, text: message, parse_mode: 'Markdown' })
        }).catch(e => console.error("Error enviado a Telegram:", e));
    }

    renderButtons();
    loadTgConfig();
    renderTable();
</script>
</body>
</html>
