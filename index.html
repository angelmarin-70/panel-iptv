<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body class="dark-bg text-slate-100 min-h-screen pb-12">

        <!-- CABECERA -->

        <!-- SECCIÓN 1: PANELES IPTV -->

                <button onclick="abrirLnk(PANELES_URLS['Max Player (P2)'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="server" class="w-4 h-4 text-slate-400"></i> Max Player (P2)

                <button onclick="abrirLnk(PANELES_URLS['Emby'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">

                <button onclick="abrirLnk(PANELES_URLS['Zafiro'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="shield" class="w-4 h-4 text-slate-400"></i> Zafiro

                    <i data-lucide="play-circle" class="w-4 h-4 text-slate-400"></i> Dylan

                    <i data-lucide="zap" class="w-4 h-4 text-slate-400"></i> Joker

                <button onclick="abrirLnk(PANELES_URLS['TS4K'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="tv-2" class="w-4 h-4 text-slate-400"></i> TS4K
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Nexon'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="cpu" class="w-4 h-4 text-slate-400"></i> Nexon
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Regilón'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="crown" class="w-4 h-4 text-slate-400"></i> Regilón

                <button onclick="abrirLnk(PANELES_URLS['P2P'])" class="bg-black hover:bg-slate-900 text-white border border-slate-800 p-2.5 rounded-lg text-xs text-center font-medium transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="share-2" class="w-4 h-4 text-slate-400"></i> P2P

        <!-- SECCIÓN 2: PANELES APLICACIONES -->
        <div class="card-bg p-5 rounded-xl border border-blue-900/40 space-y-3">
            <h2 class="text-base font-bold text-blue-400 flex items-center gap-2 uppercase tracking-wide">
                <i data-lucide="layout-grid" class="text-blue-400"></i> Paneles Aplicaciones
            </h2>
            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-2.5">
                <button onclick="abrirLnk(PANELES_URLS['iBox Player'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="box" class="w-4 h-4"></i> iBox Player
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Max Player App'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="play" class="w-4 h-4"></i> Max Player App
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Smartone'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="aperture" class="w-4 h-4"></i> Smartone
                </button>
                <button onclick="abrirLnk(PANELES_URLS['CR7 Panel'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="trophy" class="w-4 h-4"></i> CR7 Panel

                <button onclick="abrirLnk(PANELES_URLS['IBO Player'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="smartphone" class="w-4 h-4"></i> IBO Player
                </button>
                <button onclick="abrirLnk(PANELES_URLS['IBO Sol'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="sun" class="w-4 h-4"></i> IBO Sol
                </button>
                <button onclick="abrirLnk(PANELES_URLS['IBO Lopes'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="user-check" class="w-4 h-4"></i> IBO Lopes
                </button>
                <button onclick="abrirLnk(PANELES_URLS['DonIBO'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="shield-check" class="w-4 h-4"></i> DonIBO
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Tivimate VPN'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="lock" class="w-4 h-4"></i> Tivimate VPN
                </button>
                <button onclick="abrirLnk(PANELES_URLS['VU Player Marine'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="monitor" class="w-4 h-4"></i> VU Player (Marine)
                </button>
                <button onclick="abrirLnk(PANELES_URLS['IBO Killer'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="skull" class="w-4 h-4"></i> IBO Killer
                </button>
                <button onclick="abrirLnk(PANELES_URLS['XCIPTV Phoenix'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="flame" class="w-4 h-4"></i> XCIPTV Phoenix
                </button>
                <button onclick="abrirLnk(PANELES_URLS['Tivimate Phoenix'])" class="bg-blue-600 hover:bg-blue-500 text-white p-2.5 rounded-lg text-xs text-center font-semibold transition flex items-center justify-center gap-2 shadow">
                    <i data-lucide="tv" class="w-4 h-4"></i> Tivimate Phoenix
                </button>
            </div>
        </div>

        <!-- FORMULARIO DE ALTA Y EDICIÓN -->
        <div class="card-bg p-5 rounded-xl border border-slate-700">
            <h2 id="formTitle" class="text-xl font-bold mb-4 text-emerald-400 flex items-center gap-2">
                <i data-lucide="user-plus"></i> Registrar Nuevo Cliente
            </h2>
            <form id="clienteForm" onsubmit="guardarCliente(event)" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <input type="hidden" id="clienteId">
                
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Nombre del Cliente *</label>
                    <input type="text" id="nombre" required class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Teléfono (WhatsApp)</label>
                    <input type="text" id="telefono" placeholder="+34123456789" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Aplicación Instalada</label>
                    <select id="app" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        <option value="IBO Player">IBO Player</option>
                        <option value="iBox Player">iBox Player</option>
                        <option value="Max Player App">Max Player App</option>
                        <option value="Smartone">Smartone</option>
                        <option value="CR7 Panel">CR7 Panel</option>
                        <option value="IBO Sol">IBO Sol</option>
                        <option value="IBO Lopes">IBO Lopes</option>
                        <option value="DonIBO">DonIBO</option>
                        <option value="Tivimate VPN">Tivimate VPN</option>
                        <option value="VU Player Marine">VU Player Marine</option>
                        <option value="IBO Killer">IBO Killer</option>
                        <option value="XCIPTV Phoenix">XCIPTV Phoenix</option>
                        <option value="Tivimate Phoenix">Tivimate Phoenix</option>
                        <option value="Otra">Otra</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Dirección MAC</label>
                    <input type="text" id="mac" placeholder="00:1A:2B:3C:4D:5E" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Contraseña App</label>
                    <input type="text" id="claveApp" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Panel IPTV / Servidor</label>
                    <select id="panel" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                        <option value="Max Player (P1)">Max Player (P1)</option>
                        <option value="Max Player (P2)">Max Player (P2)</option>
                        <option value="Emby">Emby</option>
                        <option value="Zafiro">Zafiro</option>
                        <option value="Dylan">Dylan</option>
                        <option value="Joker">Joker</option>
                        <option value="TS4K">TS4K</option>
                        <option value="Nexon">Nexon</option>
                        <option value="Regilón">Regilón</option>
                        <option value="DonIPTV">DonIPTV</option>
                        <option value="P2P">P2P</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Fecha de Vencimiento *</label>
                    <input type="date" id="vencimiento" required class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">Notas / Observaciones</label>
                    <input type="text" id="notas" placeholder="Ej: Dispositivo Samsung TV" class="w-full input-bg border border-slate-600 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-emerald-500">
                </div>

                <div class="lg:col-span-4 flex justify-end gap-2 mt-2">
                    <button type="button" onclick="resetFormulario()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition">
                        Cancelar / Limpiar
                    </button>
                    <button type="submit" class="bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 px-6 rounded-lg transition flex items-center gap-2">
                        <i data-lucide="save"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>

        <!-- LISTADO Y BUSCADOR -->
        <div class="card-bg p-5 rounded-xl border border-slate-700 space-y-4">
            <div class="flex flex-col md:flex-row justify-between gap-4">
                <h2 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="users"></i> Lista de Clientes (<span id="totalClientes">0</span>)
                </h2>
                <div class="relative w-full md:w-72">
                    <i data-lucide="search" class="w-4 h-4 absolute left-3 top-3 text-slate-400"></i>
                    <input type="text" id="buscar" oninput="renderizarTabla()" placeholder="Buscar cliente, MAC, app..." class="w-full pl-9 pr-4 py-2 input-bg border border-slate-600 rounded-lg text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
            </div>

            <!-- TABLA -->
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Cliente</th>
                            <th class="p-3">Panel IPTV</th>
                            <th class="p-3">App</th>
                            <th class="p-3">Ir a App</th>
                            <th class="p-3">Datos App</th>
                            <th class="p-3">Vencimiento</th>
                            <th class="p-3">Estado</th>
                            <th class="p-3 text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaClientes" class="divide-y divide-slate-700">
                        <!-- Carga dinámica -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL FICHA DE CLIENTE -->
    <div id="modalFicha" class="fixed inset-0 bg-black/70 hidden items-center justify-center p-4 z-50">
        <div class="card-bg p-6 rounded-xl border border-slate-700 w-full max-w-md space-y-4 relative">
            <button onclick="cerrarFicha()" class="absolute top-4 right-4 text-slate-400 hover:text-white">
                <i data-lucide="x"></i>
            </button>
            <h3 class="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <i data-lucide="id-card"></i> Ficha Completa del Cliente
            </h3>
            <div id="contenidoFicha" class="space-y-2 text-sm">
                <!-- Carga dinámica -->
            </div>
            <div class="pt-4 flex justify-end">
                <button onclick="cerrarFicha()" class="bg-slate-700 hover:bg-slate-600 text-white font-semibold py-2 px-4 rounded-lg transition">
                    Cerrar
                </button>
            </div>
        </div>
    </div>

    <script>
        // DICCIONARIO CON TODAS LAS URLS CONFIGURADAS Y OPERATIVAS
        const PANELES_URLS = {
            // Paneles IPTV
            "Max Player (P1)": "https://panel.maxplayer.io",
            "Max Player (P2)": "https://panel2.maxplayer.io",
            "Emby": "https://emby.media",
            "DonIPTV": "https://doniptv.com",
            "Zafiro": "https://koramendi.eu/dashboard",
            "Dylan": "https://599.iglesiadecristoredentor.org:2053/piruletas@@2020/login",
            "Joker": "https://respaneller.xyz/generalcOyYsDqo/login?referrer=dashboard",
            "TS4K": "https://storm-panel.pro/login.php",
            "Nexon": "https://cms-nexon.org/nexon/login.php?referrer=subresellers.php",
            "Regilón": "https://treemor.uk/TARANTULA2/login",
            "P2P": "https://p2pro.sigma.st",

            // Paneles de Aplicaciones
            "iBox Player": "https://iboxxiptv.com/device/login",
            "Max Player App": "https://my.maxplayer.tv/auth/login",
            "Smartone": "https://smartone-iptv.com/es/aplicacion-iptv-para-samsung",
            "CR7 Panel": "https://cr7panel.com/",
            "IBO Player": "https://iboplayer.com/",
            "IBO Sol": "https://ibosol.com/login",
            "IBO Lopes": "https://maxtvapps.pw/Apks/Ibo/Lopes/index.php",
            "DonIBO": "https://nertix.org/ibopanel4/users.php",
            "Tivimate VPN": "https://globalvip.website/rbatv/nuepp/tiviproat/",
            "VU Player Marine": "https://rgvipplus.site/vu2/marine/",
            "IBO Killer": "https://maxtvapps.pw/Apks/Ibo/Killer1/",
            "XCIPTV Phoenix": "https://maxtvapps.pw/Apks/Xciptv/Phoenix/index.php",
            "Tivimate Phoenix": "https://maxtvapps.pw/Apks/Tivimate/Phoenix/"
        };

        let clientes = JSON.parse(localStorage.getItem("iptv_clientes_v26")) || JSON.parse(localStorage.getItem("iptv_clientes_v25")) || JSON.parse(localStorage.getItem("iptv_clientes_v24")) || [];

        document.addEventListener("DOMContentLoaded", () => {
            lucide.createIcons();
            renderizarTabla();
        });

        function abrirLnk(url) {
            if (!url || url === '#') {
                alert('El enlace de este panel aún no está configurado.');
                return;
            }
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        function guardarCliente(e) {
            e.preventDefault();
            const id = document.getElementById("clienteId").value;
            const nuevoCliente = {
                id: id ? parseInt(id) : Date.now(),
                nombre: document.getElementById("nombre").value.trim(),
                telefono: document.getElementById("telefono").value.trim(),
                app: document.getElementById("app").value,
                mac: document.getElementById("mac").value.trim(),
                claveApp: document.getElementById("claveApp").value.trim(),
                panel: document.getElementById("panel").value,
                vencimiento: document.getElementById("vencimiento").value,
                notas: document.getElementById("notas").value.trim()
            };

            if (id) {
                clientes = clientes.map(c => c.id === parseInt(id) ? nuevoCliente : c);
            } else {
                clientes.push(nuevoCliente);
            }

            guardarDatos();
            resetFormulario();
            renderizarTabla();
        }

        function guardarDatos() {
            localStorage.setItem("iptv_clientes_v26", JSON.stringify(clientes));
        }

        function renderizarTabla() {
            const tbody = document.getElementById("tablaClientes");
            const busqueda = document.getElementById("buscar").value.toLowerCase();
            tbody.innerHTML = "";

            const clientesFiltrados = clientes.filter(c => 
                c.nombre.toLowerCase().includes(busqueda) ||
                (c.mac && c.mac.toLowerCase().includes(busqueda)) ||
                (c.app && c.app.toLowerCase().includes(busqueda)) ||
                (c.panel && c.panel.toLowerCase().includes(busqueda))
            );

            document.getElementById("totalClientes").innerText = clientesFiltrados.length;

            const hoy = new Date().setHours(0,0,0,0);

            clientesFiltrados.forEach(c => {
                const fechaVenc = new Date(c.vencimiento).setHours(0,0,0,0);
                const difDias = Math.ceil((fechaVenc - hoy) / (1000 * 60 * 60 * 24));
                
                let badgeEstado = "";
                if (difDias < 0) {
                    badgeEstado = `<span class="bg-red-500/20 text-red-400 border border-red-500/30 px-2 py-1 rounded text-xs">Caducado (${Math.abs(difDias)}d)</span>`;
                } else if (difDias <= 3) {
                    badgeEstado = `<span class="bg-amber-500/20 text-amber-400 border border-amber-500/30 px-2 py-1 rounded text-xs animate-pulse">Por caducar (${difDias}d)</span>`;
                } else {
                    badgeEstado = `<span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded text-xs">Activo (${difDias}d)</span>`;
                }

                const urlApp = PANELES_URLS[c.app] || "#";
                const botonIrApp = urlApp !== "#" 
                    ? `<button onclick="abrirLnk('${urlApp}')" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1 rounded-md inline-flex items-center gap-1 transition font-medium">
                        <i data-lucide="external-link" class="w-3 h-3"></i> ${c.app}
                       </button>`
                    : `<span class="text-xs text-slate-500">—</span>`;

                const tr = document.createElement("tr");
                tr.className = "hover:bg-slate-800/50 transition border-b border-slate-700/50";
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">${c.nombre}</td>
                    <td class="p-3 text-slate-300">${c.panel}</td>
                    <td class="p-3 text-slate-300">${c.app}</td>
                    <td class="p-3">${botonIrApp}</td>
                    <td class="p-3 text-xs">
                        <div><span class="text-slate-400">MAC:</span> ${c.mac || 'N/A'}</div>
                        <div><span class="text-slate-400">Clave:</span> ${c.claveApp || 'N/A'}</div>
                    </td>
                    <td class="p-3 text-slate-300">${c.vencimiento}</td>
                    <td class="p-3">${badgeEstado}</td>
                    <td class="p-3 text-center">
                        <div class="flex items-center justify-center gap-2">
                            <button onclick="enviarWhatsApp('${c.telefono}', '${c.nombre}', '${c.app}', ${difDias})" class="bg-emerald-600 hover:bg-emerald-500 p-1.5 rounded text-white" title="WhatsApp">
                                <i data-lucide="message-circle" class="w-4 h-4"></i>
                            </button>
                            <button onclick="verFicha(${c.id})" class="bg-blue-600 hover:bg-blue-500 p-1.5 rounded text-white" title="Ver Ficha">
                                <i data-lucide="eye" class="w-4 h-4"></i>
                            </button>
                            <button onclick="editarCliente(${c.id})" class="bg-amber-600 hover:bg-amber-500 p-1.5 rounded text-white" title="Editar">
                                <i data-lucide="edit-2" class="w-4 h-4"></i>
                            </button>
                            <button onclick="eliminarCliente(${c.id})" class="bg-red-600 hover:bg-red-500 p-1.5 rounded text-white" title="Eliminar">
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                            </button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            lucide.createIcons();
        }

        function editarCliente(id) {
            const c = clientes.find(item => item.id === id);
            if (!c) return;
            document.getElementById("clienteId").value = c.id;
            document.getElementById("nombre").value = c.nombre;
            document.getElementById("telefono").value = c.telefono;
            document.getElementById("app").value = c.app;
            document.getElementById("mac").value = c.mac;
            document.getElementById("claveApp").value = c.claveApp;
            document.getElementById("panel").value = c.panel;
            document.getElementById("vencimiento").value = c.vencimiento;
            document.getElementById("notas").value = c.notas;
            document.getElementById("formTitle").innerText = "Editar Cliente";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function eliminarCliente(id) {
            if (confirm("¿Estás seguro de eliminar este cliente?")) {
                clientes = clientes.filter(c => c.id !== id);
                guardarDatos();
                renderizarTabla();
            }
        }

        function resetFormulario() {
            document.getElementById("clienteForm").reset();
            document.getElementById("clienteId").value = "";
            document.getElementById("formTitle").innerText = "Registrar Nuevo Cliente";
        }

        function enviarWhatsApp(telefono, nombre, app, dias) {
            if (!telefono) {
                alert("Este cliente no tiene guardado un número de teléfono.");
                return;
            }
            let mensaje = "";
            if (dias < 0) {
                mensaje = `Hola ${nombre}, tu suscripción en la aplicación ${app} ha caducado. ¿Te interesa renovar para seguir disfrutando del servicio? ¡Gracias!`;
            } else {
                mensaje = `Hola ${nombre}, te recordamos que a tu aplicación ${app} le quedan ${dias} día(s) para caducar. ¿Te interesa renovar? ¡Gracias!`;
            }
            const cleanTel = telefono.replace(/[^0-9]/g, '');
            window.open(`https://wa.me/${cleanTel}?text=${encodeURIComponent(mensaje)}`, '_blank');
        }

        function verFicha(id) {
            const c = clientes.find(item => item.id === id);
            if (!c) return;

            const urlApp = PANELES_URLS[c.app] || "#";
            const btnAppModal = urlApp !== "#" 
                ? `<button onclick="abrirLnk('${urlApp}')" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg text-center font-medium transition flex items-center justify-center gap-2">
                    <i data-lucide="external-link" class="w-4 h-4"></i> Abrir Web de ${c.app}
                   </button>`
                : '';

            document.getElementById("contenidoFicha").innerHTML = `
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Nombre:</strong> <span class="text-white">${c.nombre}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Teléfono:</strong> <span class="text-white">${c.telefono || 'N/A'}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Panel IPTV:</strong> <span class="text-white">${c.panel}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Aplicación:</strong> <span class="text-white">${c.app}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Dirección MAC:</strong> <span class="text-emerald-400 font-mono">${c.mac || 'N/A'}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Clave App:</strong> <span class="text-emerald-400 font-mono">${c.claveApp || 'N/A'}</span></div>
                <div class="border-b border-slate-700 pb-2"><strong class="text-slate-400">Vencimiento:</strong> <span class="text-white">${c.vencimiento}</span></div>
                <div class="pb-2"><strong class="text-slate-400">Notas:</strong> <span class="text-white">${c.notas || 'Sin observaciones'}</span></div>
                ${btnAppModal}
            `;
            document.getElementById("modalFicha").classList.remove("hidden");
            document.getElementById("modalFicha").classList.add("flex");
            lucide.createIcons();
        }

        function cerrarFicha() {
            document.getElementById("modalFicha").classList.add("hidden");
            document.getElementById("modalFicha").classList.remove("flex");
        }

        function exportarBaseDatos() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(clientes, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `copia_seguridad_iptv_${new Date().toISOString().slice(0,10)}.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
